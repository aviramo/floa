# The roster TEST Worker: the same source as floa-lead (src/worker.js), but bound ONLY to api-test.floa.co.il, draining ONLY the
# roster-test schema, and mailing ONLY the owner (ROSTER_TEST_MAIL_TO). It never touches the real schema or the real host.
# Not deployed yet. Deploy: npx wrangler deploy --config wrangler.test.toml
# Secrets (never in this file): npx wrangler secret put SUPABASE_SERVICE_KEY|ROSTER_IP_SALT|RESEND_API_KEY --config wrangler.test.toml
name = "floa-lead-test"
main = "src/worker.js"
compatibility_date = "2025-01-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "api-test.floa.co.il", custom_domain = true }]

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[vars]
LEAD_TO = "ofir.aviram@gmail.com"
LEAD_FROM = "FLOA <no-reply@floa.co.il>"
SUPABASE_URL = "https://aexmnaxvahblveejsbup.supabase.co"
ROSTER_ONLY_SCHEMA = "roster-test"
ROSTER_TEST_MAIL_TO = "ofir.aviram@gmail.com"
# ROSTER_TEST_FROM unset: every mail goes out as the business (<slug>@floa.co.il, under its own name) like the real Worker; test mail still reaches only ROSTER_TEST_MAIL_TO
# ROSTER_TEST_ADMIN_FROM unset: admins and participants are mailed by the same sender (ROSTER_TEST_FROM)
ROSTER_GOOGLE_CLIENT_IDS = "459432002435-349ppd8r1qqe9tkcdm2v3f6rpp48i1ni.apps.googleusercontent.com"   # the business's own Google app (harpatka); sign-in without the Supabase Google provider
ROSTER_AUTH_ORIGINS = "https://test.harpatka.co.il,http://localhost:8080,http://localhost:8099"

# the Workflow binding the shared source declares (chords); unused here
[[workflows]]
name = "chords-read-song-test"
binding = "READ_SONG"
class_name = "ReadSong"
