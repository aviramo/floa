<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>FLOA hero flow</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html,body{margin:0;background:#000}
#stage{position:relative;overflow:hidden;-webkit-font-smoothing:antialiased;font-family:'Noto Sans Hebrew',sans-serif}
#scenes{position:absolute;left:0;top:0;width:100%;height:100%}
.scene{position:absolute;left:0;top:0;overflow:hidden;display:none}
.a{position:absolute;left:0;top:0}
.g{position:absolute;width:0;height:0;transform-origin:0 0}
.tx{position:absolute;left:0;top:0;white-space:nowrap}
svg{overflow:visible;display:block}
</style>
<script>
// Project settings. render.py and audio.py read them from here, so this is the only place they live.
window.CONFIG = {
  W: 1640, H: 940,      // the homepage hero's art slot is 820 x 470 css px, drawn at 2x
  DUR: 18.4,            // seconds. 1.4 of calm, the mess, the drop, five gates, the panel, and 1.45 of calm again
  FPS: 60,
  bg: '#E9F0EE',        // the site's own paper colour, so the video has no edge on the page
  palette: {            // the approved colours: the site's own. Teal means FLOA, clay means what hurts
    INK: '#0F2A33', INK2: '#24444F', PAPER: '#E9F0EE', WHITE: '#FFFFFF',
    RED: '#C1594A', BLUE: '#0E8C7E', YELLOW: '#C9E6DE', GREY: '#586C73',
    TEAL: '#0E8C7E', TEALD: '#0A6C61', TINT: '#C9E6DE', CLAY: '#C1594A', CLAYD: '#8E3527', CLAYT: '#F0D7D0',
    SUNK: '#F2F7F5', LINE: '#DCE6E3',
  },
  loop: true,           // the last frame equals the first (t wraps at DUR)
  hold: 0,
  bpm: 120, beat0: 0,   // no music: a fixed half second grid
  music: null,
};
</script>
</head>
<body>
<div id="stage"><div id="scenes"></div></div>
<script src="core.js"></script>
<script src="scene.js"></script>
</body>
</html>
