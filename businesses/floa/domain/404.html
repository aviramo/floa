<!doctype html>

<head>
<meta charset="utf-8">

<title>הדף לא נמצא | FLOA</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
/* The domain's 404 is also its router of last resort.

   GitHub Pages serves a file or nothing: it has no rewrite rules, and it only
   ever looks for 404.html at the ROOT of the published site, never inside a
   folder. So an application that owns a range of addresses has no file at most
   of them, and every one of those requests lands here.

   The songs of /chords/ are written to disk now, one folder each, so that a
   search engine can have them (see businesses/chords/pages/). What still
   arrives here is everything the build cannot know: an evening, a version, an
   editor, a song added in the last minute, and a song somebody typed wrong.

   For those, and only those, this page hands the path back to the application
   that owns it. The application puts the real address back with replaceState,
   so the bar keeps reading /chords/<song> and a refresh works.

   Every other unknown address falls through to the page below and stays a
   404, which is the point: the old FLOA addresses were deleted on purpose and
   there are no redirects. */
(function () {
  var APPS = ["chords"];
  var path = location.pathname.replace(/^\/+/, "");
  var app = path.split("/")[0];
  if (APPS.indexOf(app) < 0) return;
  /* AND THE TAB IS THE APP'S FROM HERE. This document stays on the screen for
     as long as the next request takes, which on a phone is long enough to
     look at, and what it was showing for a song was the domain's mark over
     "the page was not found". An app that owns an address owns the tab for
     it, so the mark becomes its own, by the convention every app here keeps:
     /<app>/favicon.svg. */
  var mark = document.querySelector("link[rel=icon]");
  if (mark) mark.href = "/" + app + "/favicon.svg";

  var rest = path.slice(app.length).replace(/^\/+/, "").replace(/\/+$/, "");
  location.replace("/" + app + "/?p=" + rest + location.hash);
})();
</script>
