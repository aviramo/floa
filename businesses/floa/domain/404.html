<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הדף לא נמצא | FLOA</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
/* The domain's 404 is also its router of last resort.

   GitHub Pages serves a file or nothing: it has no rewrite rules, and it only
   ever looks for 404.html at the ROOT of the published site, never inside a
   folder. So an application that owns a range of addresses has no file at most
   of them, and every one of those requests lands here.

   The songs of /chords/ are written to disk now, one folder each, so that a
   search engine can have them (see businesses/chords/pages/). What still
   arrives here is everything the build cannot know: an evening, a version, an
   editor, a song added in the last minute, and a song somebody typed wrong.

   For those, and only those, this page hands the path back to the application
   that owns it. The application puts the real address back with replaceState,
   so the bar keeps reading /chords/<song>/ and a refresh works.

   Every other unknown address falls through to the page below and stays a
   404, which is the point: the old FLOA addresses were deleted on purpose and
   there are no redirects. */
(function () {
  var APPS = ["chords"];
  var path = location.pathname.replace(/^\/+/, "");
  var app = path.split("/")[0];
  if (APPS.indexOf(app) < 0) return;
  /* AND THE TAB IS THE APP'S FROM HERE. This document stays on the screen for
     as long as the next request takes, which on a phone is long enough to
     look at, and what it was showing for a song was the domain's mark over
     "the page was not found". An app that owns an address owns the tab for
     it, so the mark becomes its own, by the convention every app here keeps:
     /<app>/favicon.svg. */
  var mark = document.querySelector("link[rel=icon]");
  if (mark) mark.href = "/" + app + "/favicon.svg";

  /* A NAME THAT CAME BACK AS A ROW OF X'S.

     GitHub Pages serves a folder at the address with the slash on the end, and
     asked for the one without it, it does not serve the file: it answers with
     a redirect, and it writes the folder's name into the Location header as
     raw bytes. A header cannot carry those. The browser reads them one at a
     time as Latin-1, so a Hebrew song name turns into a row of x's on the way,
     and the address it then asks for is nowhere, which is how it arrives here.

     The name is still inside it, one layer down, and this takes it back out.
     The applications no longer ask for the address that redirects (see addr in
     chords/assets/app.js), but every link anybody has already sent does, and
     those should still open the song they were sent for. */
  function repair(encoded) {
    var text;
    try { text = decodeURIComponent(encoded); } catch (e) { return encoded; }
    /* Mangled text is bytes read one at a time, so all of it is under 256
       and some of it is over 127. Anything else is a name and is left alone. */
    var bytes = [], byteish = false, high = false;
    for (var i = 0; i < text.length; i++) {
      var code = text.charCodeAt(i);
      if (code > 255) { byteish = false; break; }
      if (code > 127) high = true;
      bytes.push(code);
      byteish = true;
    }
    if (byteish && high) {
      try {
        /* Strict on purpose. A name that genuinely carries an accent is not
           valid UTF-8 when read as bytes, so it throws here and stays itself. */
        text = new TextDecoder("utf-8", { fatal: true }).decode(new Uint8Array(bytes));
      } catch (e) { /* it was never mangled */ }
    }
    return text.split("/").map(encodeURIComponent).join("/");
  }

  var rest = path.slice(app.length).replace(/^\/+/, "").replace(/\/+$/, "");
  /* AND WHATEVER WAS ASKED ALONG WITH THE ADDRESS. The path was being handed
     on and the question after it dropped, so a link to one recording of a song
     (/chords/<song>/?t=…) arrived at the app as a link to the song and
     nothing else: the page opened, the recording did not play, and the reader
     had no way of knowing there had been one. `p` goes first and the rest
     follows it, which is the order the app takes them apart in. */
  var asked = location.search.replace(/^\?/, "");
  location.replace("/" + app + "/?p=" + repair(rest) +
    (asked ? "&" + asked : "") + location.hash);
})();
</script>

</style>

  <div class="box">
    <p class="code">404</p>
