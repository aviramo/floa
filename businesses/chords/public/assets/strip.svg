<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 320" width="1600" height="320">
<!-- ==========================================================================
     THE BAND UNDER THE BAR, and the only drawing in the app.

     Two people in the middle of a song: she is leaning back with a fist in the
     air and the microphone at her mouth, he is bent over the guitar with his
     arm through the strum. Silhouettes, because a silhouette is anybody: this
     library is sung by whoever opened it, and a drawn face would be a person
     who is not them.

     THE WHOLE OF IT IS THE ONE SECOND IT IS DRAWING. Nobody is standing here:
     both of them are off the upright, both stances are wide, her hair is
     behind her and his arm has left a trail of where it just was. A silhouette
     that stands straight with its arms down is a person waiting, and a library
     of songs is not a queue.

     AND HE IS PLAYING IT RATHER THAN HOLDING IT. The hand is past the strings
     and below them with the streaks of the sweep still on the face of the
     guitar, the other hand is closed on the neck, and the body is turned into
     the instrument. A hand resting on a guitar is a photograph of somebody
     about to begin.

     In the app's own colours rather than in black: the people are the ink
     every word here is written in, the guitar is the green, and the voice and
     a note or two are the red a chord is written in.

     IT IS WIDER THAN EITHER FRAME IT IS SHOWN IN. A phone gets it in
     landscape and a desk gets a strip of it (see .strip in style.css), so the
     drawing is cropped rather than reshaped, and the two figures stand inside
     the part that is in every frame: x from 520 to 1080, y from 40 to 280. The
     stave runs past both ends, which is what a stave does, and the notes out
     at the two sides are for the width a desk has and a phone has not.
     ========================================================================== -->
<defs>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f2f9f7"/>
    <stop offset="1" stop-color="#dfece8"/>
  </linearGradient>
  <!-- The light they are standing in. -->
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <!-- The soundhole is a hole, and not a paler circle painted on the guitar:
       whatever is behind the drawing at that point is what shows through. It
       is in the guitar's own coordinates, which is why it is a shape here and
       a mask on the group that carries the same transform. -->
  <mask id="soundhole">
    <rect x="-400" y="-400" width="1200" height="800" fill="#ffffff"/>
    <circle cx="-62" cy="-38" r="14" fill="#000000"/>
  </mask>
  <!-- One note, and one pair of notes beamed together, drawn once here and
       put down wherever they are wanted. They carry no colour of their own:
       each takes the colour of the group it is used in. -->
  <g id="note">
    <ellipse cx="0" cy="0" rx="10" ry="7.2" transform="rotate(-22)"/>
    <rect x="7.4" y="-46" width="3.4" height="46"/>
    <path d="M10.8 -46C24 -38 26 -26 20 -15C24 -28 20 -37 10.8 -40Z"/>
  </g>
  <g id="pair">
    <ellipse cx="0" cy="0" rx="10" ry="7.2" transform="rotate(-22)"/>
    <ellipse cx="30" cy="-8" rx="10" ry="7.2" transform="rotate(-22 30 -8)"/>
    <rect x="7.4" y="-46" width="3.4" height="46"/>
    <rect x="37.4" y="-54" width="3.4" height="46"/>
    <path d="M7.4 -46L40.8 -54L40.8 -45L7.4 -37Z"/>
  </g>
</defs>

<rect width="1600" height="320" fill="url(#wash)"/>
<ellipse cx="790" cy="180" rx="560" ry="260" fill="url(#glow)"/>

<!-- THE STAVE, AND IT IS ONE LINE OF MUSIC ACROSS THE WHOLE BAND. Behind the
     two of them, because they are what is being looked at, and out past both
     ends, because a phone is given the middle of this drawing and a desk is
     given the width. -->
<g fill="none" stroke="#0e8c7e" stroke-opacity=".3" stroke-width="1.6">
  <path d="M-20 230C200 230 380 120 800 96C1220 72 1400 150 1620 120"/>
  <path d="M-20 244C200 244 380 134 800 110C1220 86 1400 164 1620 134"/>
  <path d="M-20 258C200 258 380 148 800 124C1220 100 1400 178 1620 148"/>
  <path d="M-20 272C200 272 380 162 800 138C1220 114 1400 192 1620 162"/>
  <path d="M-20 286C200 286 380 176 800 152C1220 128 1400 206 1620 176"/>
</g>

<!-- The notes on it. The ones in red are the colour every chord in this app is
     written in, so the two things a song is made of are both in the picture. -->
<g fill="#0e8c7e" fill-opacity=".55">
  <!-- These two stand close in beside them, inside the part of the drawing a
       phone is given: everything further out is a desk's. -->
  <use href="#note" transform="translate(548 122) scale(1.1) rotate(-8)"/>
  <use href="#note" transform="translate(150 214) scale(1.15) rotate(6)"/>
  <use href="#pair" transform="translate(268 190)"/>
  <use href="#note" transform="translate(430 152) scale(1.25) rotate(-7)"/>
  <use href="#pair" transform="translate(1148 106) scale(1.1) rotate(5)"/>
  <use href="#note" transform="translate(1330 128) scale(1.25) rotate(-6)"/>
  <use href="#note" transform="translate(1470 150)"/>
</g>
<g fill="#e11d63" fill-opacity=".5">
  <use href="#pair" transform="translate(1024 126) rotate(-6)"/>
  <use href="#note" transform="translate(360 166) rotate(8)"/>
  <use href="#note" transform="translate(1268 112) scale(1.15) rotate(-9)"/>
</g>

<!-- SHE IS SINGING, and every line of her says so: off the upright and going
     back, the stance open, one fist up, and the hair still catching up with
     the head. Everything is drawn about her hips, which is the one point she
     is turning around, and the lean is the last thing done to her. -->
<g transform="translate(636 240) rotate(-10)">
  <g fill="#17202a">
    <!-- the hair goes first: it is behind her -->
    <path d="M-12 -186C-32 -198 -50 -196 -60 -184C-46 -186 -36 -182 -28 -176C-44 -170 -52 -160 -54 -150C-42 -160 -28 -166 -16 -166Z"/>
    <circle cx="0" cy="-168" r="23"/>
    <rect x="-9" y="-152" width="18" height="16"/>
    <path d="M0 -146C-26 -144 -42 -130 -46 -110L-34 -50L-30 0L30 0L34 -50L46 -110C42 -130 26 -144 0 -146Z"/>
    <circle cx="32" cy="-172" r="11"/>
    <circle cx="-42" cy="-190" r="10"/>
  </g>
  <g fill="none" stroke="#17202a" stroke-linecap="round">
    <path d="M-14 -4L-56 72" stroke-width="26"/>
    <path d="M14 -4L44 76" stroke-width="26"/>
    <!-- the arm with the microphone in it, and the arm that has nothing in it -->
    <path d="M40 -108C66 -124 62 -146 48 -158" stroke-width="17"/>
    <path d="M-34 -108C-58 -132 -52 -160 -42 -186" stroke-width="16"/>
    <path d="M40 -164L50 -154" stroke-width="9"/>
  </g>
  <!-- what is coming out of it -->
  <g fill="none" stroke="#e11d63" stroke-linecap="round">
    <path d="M37.2 -191.3A20 20 0 0 1 51.3 -177.2" stroke-width="3.2" stroke-opacity=".6"/>
    <path d="M39.8 -201A30 30 0 0 1 61 -179.8" stroke-width="2.8" stroke-opacity=".45"/>
    <path d="M42.4 -210.6A40 40 0 0 1 70.6 -182.4" stroke-width="2.4" stroke-opacity=".3"/>
  </g>
</g>

<!-- HE IS PLAYING IT. Same hips, same lean, the other way: into the guitar.
     The guitar is drawn over him and his arms over the guitar, which is the
     order the three of them are actually in. -->
<g transform="translate(944 240) rotate(7)">
  <g fill="#17202a">
    <path d="M14 -184C34 -194 48 -186 52 -172C40 -178 30 -176 22 -172C34 -164 38 -154 38 -146C28 -156 16 -162 6 -164Z"/>
    <circle cx="0" cy="-168" r="23"/>
    <rect x="-9" y="-152" width="18" height="16"/>
    <path d="M0 -146C-26 -144 -42 -130 -46 -110L-34 -50L-30 0L30 0L34 -50L46 -110C42 -130 26 -144 0 -146Z"/>
  </g>
  <g fill="none" stroke="#17202a" stroke-linecap="round">
    <path d="M-16 -4L-58 74" stroke-width="26"/>
    <path d="M16 -4L46 72" stroke-width="26"/>
  </g>

  <!-- WHERE THE ARM HAS JUST BEEN, and the only reason anybody can tell this
       hand is moving. Two thin arcs off the way it came, fainter the further
       back they are. -->
  <g fill="none" stroke="#17202a" stroke-linecap="round" stroke-width="3">
    <path d="M52 -78C60 -44 48 -14 20 6" stroke-opacity=".2"/>
    <path d="M64 -84C74 -46 60 -12 28 12" stroke-opacity=".12"/>
  </g>

  <g mask="url(#soundhole)">
    <g fill="#0a6c61">
      <circle cx="-46" cy="-24" r="48"/>
      <circle cx="-96" cy="-68" r="38"/>
    </g>
    <g fill="none" stroke="#0a6c61" stroke-linecap="round">
      <path d="M-124 -93L-196 -156" stroke-width="15"/>
      <path d="M-196 -156L-212 -170" stroke-width="26"/>
    </g>
  </g>
  <!-- The strings, over the hole the way strings are, and the sweep of the
       hand still on them. -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M-187.4 -155L-37.4 -19" stroke-width="1.5" stroke-opacity=".45"/>
    <path d="M-192.6 -149L-42.6 -13" stroke-width="1.5" stroke-opacity=".45"/>
    <path d="M-8 -36C-12 -24 -20 -14 -30 -8" stroke-width="4" stroke-opacity=".5"/>
    <path d="M-2 -18C-6 -6 -14 2 -24 8" stroke-width="4" stroke-opacity=".38"/>
    <path d="M-14 -2C-20 6 -28 12 -38 14" stroke-width="4" stroke-opacity=".26"/>
  </g>

  <g fill="none" stroke="#17202a" stroke-linecap="round">
    <!-- the hand that is through the strings, and the hand that is holding the
         chord down -->
    <path d="M38 -110C48 -66 22 -22 -16 -6" stroke-width="20"/>
    <path d="M-38 -112C-78 -100 -122 -104 -156 -122" stroke-width="18"/>
  </g>
</g>
</svg>
