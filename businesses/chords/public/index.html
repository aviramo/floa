<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>אקורדים</title>
<meta name="description" content="אינדקס שירים עם אקורדים, כל שיר בדף משלו והאקורדים בדיוק מעל המילים.">
<meta name="robots" content="noindex">
<link rel="icon" href="/chords/favicon.svg" type="image/svg+xml">
<!-- The same mark as a bitmap, for the two places that cannot read the one
     above it: a phone putting the app on a home screen wants a raster, and
     without one it takes the mark at the root of the domain, which is FLOA's.
     Drawn from the same numbers by scripts/icon.mjs. -->
<link rel="apple-touch-icon" href="/chords/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="/chords/" aria-label="אקורדים" title="אקורדים">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    </a>
    <!-- The tick that takes everything on the page, between the mark and the
         name of the page. Only the library ever fills it; see rehome. -->
    <div class="top-pick" id="topPick"></div>
    <div class="top-name">
      <div class="top-where" id="topWhere"></div>
    </div>
    <div class="top-facts" id="topFacts"></div>
    <div class="top-find" id="topFind"></div>
    <div class="top-actions" id="topActions"></div>
  </div>
</header>

<main id="app" class="wrap" aria-live="polite"></main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<dialog id="meDialog" class="dlg">
  <form class="dlg-in" id="meForm">
    <h2>החשבון</h2>
    <p class="muted" id="meWho"></p>
    <label>השם שלך<input type="text" name="name" autocomplete="name" maxlength="60" required></label>
    <p class="muted">זה השם שמופיע למעלה. אפשר לשנות אותו, גם אם הוא הגיע מגוגל.</p>
    <p class="err" id="meErr" hidden></p>
    <!-- The way to the bill, for the one account that gets it. In this panel
         and nowhere else: it is the room where the account looks at itself,
         and what the readings cost is the account's own business. Hidden for
         everybody else by the script, which is a courtesy and not the rule:
         the rule is on the table (see song_costs in schema.sql). -->
    <div class="dlg-door" id="meBillRow" hidden>
      <button type="button" class="btn ghost small" id="meBill">פענוח</button>
      <span class="muted">כמה עלה כל פענוח, מתי, ומי ביצע אותו.</span>
    </div>
    <div class="dlg-actions">
      <button type="button" class="btn ghost far" id="meOut">יציאה מהחשבון</button>
      <button type="button" class="btn ghost" data-close>ביטול</button>
      <button type="submit" class="btn">שמירה</button>
    </div>
  </form>
</dialog>

<script src="/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
