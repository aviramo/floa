<!doctype html>
<html lang="he" dir="rtl">
<head>
<!-- THE SHELL, and not a page. Every address here is built from this file by
     the build (see pages/render.js): the app's own markup, plus a title, a
     description and a copy of the words for whoever is reading without
     running the script, which is a crawler and anybody on a slow line.
     It sits outside public/ because public/ is copied verbatim, and a file
     copied verbatim would land on top of the index this becomes. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="אקורדים">
<meta property="og:locale" content="he_IL">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<link rel="icon" href="/chords/favicon.svg" type="image/svg+xml">
<!-- The same mark as a bitmap, for the two places that cannot read the one
     above it: a phone putting the app on a home screen wants a raster, and
     without one it takes the mark at the root of the domain, which is FLOA's.
     Drawn from the same numbers by scripts/icon.mjs. -->
<link rel="apple-touch-icon" href="/chords/apple-touch-icon.png">
<link rel="stylesheet" href="/chords/assets/style.css">
{{head}}
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="/chords/" aria-label="אקורדים" title="אקורדים">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    </a>
    <div class="top-name">
      <div class="top-where" id="topWhere"></div>
      <!-- Who wrote the song, under its name and smaller than it: the second
           line of the title, on the page it is about and nowhere else. -->
      <div class="top-under" id="topUnder"></div>
    </div>
    <div class="top-facts" id="topFacts"></div>
    <div class="top-find" id="topFind"></div>
    <div class="top-actions" id="topActions"></div>
  </div>
</header>

<main id="app" class="wrap" aria-live="polite">{{seed}}</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- NOT A SHEET. Every other panel over the page is about the song under it and
     rises from the foot of the screen over the thing it belongs to; this one is
     about the account, it belongs to no page in particular, and it opens in the
     middle of the screen with no bar to push it back down. See .dlg.pop in the
     stylesheet and openPop in app.js. -->
<dialog id="meDialog" class="dlg pop">
  <form class="dlg-in" id="meForm">
    <!-- AND THE PANEL OPENS ONTO ITS OWN NAME. A dialog with nothing marked
         hands the focus to the first thing inside it that can take one, which
         here is the field with the name in it, and a focused field on a phone
         is a keyboard: half the panel covered on the way in, for a name almost
         nobody opened this to change. So the heading takes it, the same way it
         does on the panel about a song (see metaTitle in app.js). It is where
         the panel starts and not a control, so it wears no ring. -->
    <h2 tabindex="-1" autofocus>החשבון</h2>
    <p class="muted" id="meWho"></p>
    <label>השם שלך<input type="text" name="name" autocomplete="name" maxlength="60" required></label>
    <p class="err" id="meErr" hidden></p>
    <!-- No ביטול: a press on the page behind this, or back, is the way out of
         it, the same as it is out of every other panel here. -->
    <div class="dlg-actions">
      <button type="button" class="btn ghost far" id="meOut">יציאה מהחשבון</button>
      <button type="submit" class="btn">שמירה</button>
    </div>
  </form>
</dialog>

<script src="/supabase.js"></script>
<script src="/chords/assets/config.js"></script>
<!-- The microphone, and the arithmetic that turns it into a note or a chord.
     Before the app because the app asks it questions; a file of its own
     because it is signal processing and the app is an app, and the two are
     wrong in completely different ways. -->
<script src="/chords/assets/ear.js"></script>
<!-- And where in the song that puts us. Numbers in, a position out: it knows
     nothing about sound and nothing about the page, which is what lets it be
     tested exactly. -->
<script src="/chords/assets/follow.js"></script>
<script src="/chords/assets/app.js"></script>
</body>
</html>
