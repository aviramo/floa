  <script>
    /* פתיחת השיחה, ובלי דף ביניים.

       ‎wa.me הוא דף אינטרנט, לא האפליקציה: הוא פותח את האפליקציה בעצמו רק אם
       הדפדפן הרשה לו, ודפדפן בטלפון מרשה לפתוח אפליקציה רק אחרי מגע של
       המשתמש בדף. הלחיצה על המודעה בגוגל היא לא מגע בדף הזה, היא קרתה לפניו.
       לכן מי שהגיע לכאן וחיכה היה רואה את מסך ה"Open app" של wa.me במקום
       שיחה.

       אז הלחיצה על הכפתור, שהיא כן מגע, הולכת ישירות אל whatsapp://, שהוא
       האפליקציה עצמה. אם היא לא נפתחה בשנייה וחצי (אין אפליקציה במכשיר), הדף
       עדיין כאן ונופל חזרה אל wa.me, שיציע להתקין אותה. בדסקטופ אין אפליקציה
       לקפוץ אליה, אז שם הכפתור מוביל לוואטסאפ ווב.

       הדף לא זז מעצמו לעולם: רק לחיצה מזיזה אותו. העברה אוטומטית הייתה חייבת
       לעצור במסך הביניים של wa.me, כי לא נגעו בדף, וזה בדיוק הצעד המיותר
       שהיא הייתה אמורה לחסוך.

       הכתובת, המספר וההודעה נקראים מהקישור שבדף ולא נכתבים כאן שוב. */
    (function () {
      "use strict";
      var link = document.getElementById("wa");

      var url = new URL(link.href);
      var query = "phone=" + url.pathname.replace(/\D/g, "") +
                  "&text=" + encodeURIComponent(url.searchParams.get("text") || "");

      var app = "whatsapp://send?" + query;                  /* האפליקציה */
      var web = "https://web.whatsapp.com/send?" + query;    /* מסך גדול */
      var page = link.href;                                  /* wa.me, הנפילה הרכה */
      var phone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (!phone) link.href = web;

      link.addEventListener("click", function (event) {
        if (!phone) return;            /* ה-href כבר מצביע לוואטסאפ ווב */
        event.preventDefault();

        window.location.href = app;
        setTimeout(function () {
          if (document.visibilityState === "visible") window.location.href = page;
        }, 1500);
      });
    })();
  </script>
