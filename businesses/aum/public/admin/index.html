<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>משתתפים · AUM</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Assistant:wght@400;600;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FFF6DC; --sand: #F8E0A6; --terra: #C1191F; --coral: #E0661C;
      --sage: #C9B79C; --olive: #5A2410; --plum: #4A1F10; --ink: #4A2514;
      --paper: #FFFBEF; --muted: #8A6A55; --line: #EBD08F; --gold: #F2B01E;
      --green: #1F8F55; --green-bg: #DFF2E6; --red: #B3261E; --red-bg: #FBE1D8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--cream); color: var(--ink);
      font-family: "Assistant", system-ui, sans-serif; font-size: 17px; line-height: 1.4;
      -webkit-tap-highlight-color: transparent;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; }
    :focus-visible { outline: 3px solid var(--plum); outline-offset: 2px; }

    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 120px; }

    header.top {
      position: sticky; top: 0; z-index: 5; background: var(--cream);
      padding: 16px 0 10px; margin: 0 -16px; padding-inline: 16px;
    }
    .msel { position: relative; }
    #mSel { font: inherit; display: inline-flex; align-items: center; gap: 8px; background: none; color: inherit; padding: 0; cursor: pointer; }
    #mSel svg { width: 20px; height: 20px; color: var(--terra); transition: transform .2s; }
    #mSel[aria-expanded="true"] svg { transform: rotate(180deg); }
    .mmenu { left: auto; right: 0; min-width: 270px; max-height: 70vh; overflow-y: auto; }
    .mmenu button .mc { color: var(--muted); font-weight: 600; font-size: 14px; margin-inline-start: auto; padding-inline: 8px; }
    .mmenu button[aria-checked="true"] .mc { color: inherit; }
    .mmenu button { white-space: nowrap; display: grid; grid-template-columns: minmax(0, 1fr) 32px 18px; align-items: center; column-gap: 4px; justify-content: stretch; }
    .mmenu button::after { content: "" !important; display: inline-block; width: 18px; flex: 0 0 18px; text-align: center; }
    .mmenu button[aria-checked="true"]::after { content: "✓" !important; }
    .mmenu button .mc { margin: 0; padding: 0; text-align: center; }
    .mmenu button.addm2 { display: block; }
    .mmenu button.past { opacity: .6; }
    .mmenu button.addm2 { color: var(--terra); font-weight: 700; border-top: 1px solid var(--line); border-radius: 0 0 12px 12px; margin-top: 4px; }
    .mmenu button.addm2::after { content: none !important; }
    .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    h1 { font-family: "Rubik", sans-serif; font-size: 26px; margin: 0; }
    .brand { color: var(--muted); font-size: 14px; }

    .search { display: block; margin-top: 12px; position: relative; }
    .search input {
      width: 100%; height: 48px; border-radius: 16px; border: 1.5px solid var(--line);
      background: var(--paper); padding: 0 44px 0 14px; font-size: 17px;
    }
    .search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
    .sclear { display: none; position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; background: rgba(74,37,20,.10); color: var(--ink); font-size: 20px; line-height: 1; place-items: center; }
    .search input:not(:placeholder-shown) ~ .sclear { display: grid; }
    .search input:focus { border-color: var(--terra); outline: none; }
    .search svg { position: absolute; right: 12px; top: 12px; width: 20px; height: 20px; color: var(--muted); }

    .chips {
      display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px; margin: 0 -16px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px;
      height: 54px; padding: 0 16px; border-radius: 20px;
      background: var(--paper); border: 1.5px solid var(--line); font-weight: 600; white-space: nowrap;
    }
    .chip .cd { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
    .chip .cd b { font-family: "Rubik", sans-serif; font-weight: 600; font-size: 16px; }
    .chip .cd small { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-top: 2px; }
    .chip[aria-pressed="true"] .cd small { color: var(--sand); }
    .chip .count { font-weight: 600; color: var(--muted); font-size: 14px; }
    .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .chip[aria-pressed="true"] .count { color: var(--sand); }
    .chip.past:not([aria-pressed="true"]) { opacity: .6; }
    .chip.add { border-style: dashed; color: var(--terra); border-color: var(--coral); background: transparent; }

    .meeting-bar {
      display: none; align-items: center; justify-content: space-between; gap: 12px;
      margin-top: 10px; padding: 10px 14px; border-radius: 16px; background: var(--sand);
      font-size: 15px;
    }
    .meeting-bar.show { display: flex; }
    .meeting-bar b { font-family: "Rubik", sans-serif; font-weight: 600; }
    .link-btn { color: var(--plum); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

    .list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (min-width: 760px) { .list { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; } }
    .list .empty, .list .group { grid-column: 1 / -1; }
    .list .group { color: var(--muted); font-weight: 700; font-size: 14px; padding: 6px 4px 0; }
    .list .group.newp { padding: 0; }
    .row.other { background: transparent; box-shadow: none; border: 1.5px dashed var(--coral); }
    .addm { height: 30px; padding: 0 12px; border-radius: 999px; background: var(--terra); color: #fff; font-weight: 700; font-size: 14px; }
    .addm.wide { width: 100%; height: 38px; background: transparent; color: var(--terra); border: 1.5px dashed var(--coral); }
    .row {
      display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
      background: var(--paper); border-radius: 20px; padding: 14px 14px 12px;
      box-shadow: 0 1px 0 rgba(74,37,20,.05), 0 0 0 1px rgba(235,208,143,.6);
    }
    .row .main { flex: 1; min-width: 0; text-align: right; }
    .row .acts { display: flex; align-items: center; justify-content: flex-start; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
    .row .name { font-weight: 700; font-size: 18px; }
    .row .age { display: inline-block; color: var(--muted); background: #F6E7B8; border-radius: 999px; padding: 1px 10px; font-weight: 600; margin-inline-start: 10px; font-size: 14px; vertical-align: middle; white-space: nowrap; }
    .row .nm { min-width: 0; display: flex; align-items: center; gap: 6px; }
    .row .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 5px; margin-top: 3px; }
    .row .meta .age, .row .meta .ptag { font-size: 13px; padding: 1px 8px; margin: 0; }
    .row .adtag { flex: 0 0 auto; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #E3EEF3; color: #1F5C6B; }
    .row .adtag svg { width: 13px; height: 13px; }
    .row .meta > * { flex: 0 0 auto; }
    .row .age .gl { font-weight: 800; color: var(--ink); }
    .row .nm .name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
    .row .nm .age { margin-inline-start: 0; flex: 0 0 auto; }
    .row .ptag { display: inline-block; border-radius: 999px; padding: 1px 10px; font-weight: 700; font-size: 14px; white-space: nowrap; background: var(--red-bg); color: var(--red); }
    .row .ptag.paid { background: var(--green-bg); color: var(--green); }
    .row .ptag.requested { background: #FBEBC8; color: #8A5A00; }
    .row .ptag.unpaid { background: var(--red-bg); color: var(--red); }
    .row .ptag.exempt { background: #E4E9EE; color: #4B5A6A; }
    .row { cursor: pointer; }
    .row .main { cursor: pointer; }
    .pay.pi { width: 36px; height: 36px; padding: 0; display: grid; place-items: center; font-size: 18px; font-weight: 800; line-height: 1; }
    .pay.pi svg { width: 20px; height: 20px; }
    .row .phone { color: var(--ink); font-size: 15px; direction: ltr; unicode-bidi: isolate; }
    .row .note { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--red-bg); color: var(--red); }
    .tag.paid { background: var(--green-bg); color: var(--green); }
    .tag.neutral { background: rgba(74,37,20,.10); color: var(--ink); }
    button.tag { cursor: pointer; border: 2px solid transparent; font-family: inherit; }
    button.tag[aria-pressed="true"] { border-color: currentColor; }
    .tools { --ctl: 44px; display: flex; align-items: center; gap: 6px; margin-top: 12px; }
    .tools .search { margin-top: 0; flex: 1 1 auto; min-width: 0; }
    .tools .search input { height: var(--ctl); padding-right: 40px; border-radius: 999px; box-sizing: border-box; }
    .tools .search svg { top: 12px; }
    .facets { display: flex; flex: 0 1 auto; gap: 6px; min-width: 0; }
    .fx .li, .fx .gi { display: none; }
    /* במובייל החיפוש מכווץ לאייקון ומתרחב בלחיצה (ואז הסינונים מוסתרים זמנית) */
    @media (max-width: 759px) {
      .tools .search { flex: 0 0 var(--ctl); transition: flex-basis .15s; }
      .tools .search input { padding: 0; cursor: pointer; }
      .tools .search:not(:focus-within) input:placeholder-shown::placeholder { color: transparent; }
      .tools .search:focus-within, .tools:has(.search input:not(:placeholder-shown)) .search { flex: 1 1 auto; }
      .tools .search:focus-within input, .tools .search input:not(:placeholder-shown) { padding-right: 40px; cursor: text; }
      .tools:has(.search:focus-within) .facets, .tools:has(.search input:not(:placeholder-shown)) .facets, .tools:has(.search:focus-within) .sortwrap, .tools:has(.search input:not(:placeholder-shown)) .sortwrap { display: none; }
      .facets .fx { padding: 0 6px; gap: 3px; font-size: 12.5px; }
      @media (max-width: 400px) { .facets .fx { padding: 0 3px; gap: 2px; } .fgroup { padding: 3px 4px; gap: 1px; } .facets, .tools { gap: 4px; } }
      .facets .fx b { font-size: 13.5px; }
      .fx .lw.pay-lw { display: none; }
      .fx .li { display: inline; font-size: 15px; }
      .fx .lw.gen-lw { display: none; }
      .fx .gi { display: inline-grid; place-items: center; }
      .fx .gi svg { width: 17px; height: 23px; }
      .fx .gi.gm { color: #3F6FB5; }
      .fx .gi.gf { color: #C2547A; }
      .fx[aria-pressed="true"] .gi { color: inherit; }
    }
    .facets:empty { display: none; }
    .fgroup { display: inline-flex; align-items: center; height: var(--ctl); box-sizing: border-box; background: var(--paper); border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 6.5px; gap: 2px; }   /* ריווח מהמסגרת לתוכן = הריווח הפנימי בין הכפתורים (2 + 6 + 6 = 14) */
    .fx { display: inline-flex; align-items: center; gap: 6px; height: 35px; padding: 0 12px; border-radius: 999px; font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; transition: background .15s, color .15s, opacity .15s; }
    .fx b { font-family: "Rubik", sans-serif; font-size: 15px; font-weight: 700; }
    .fx.zero { opacity: .45; }
    .fx[aria-pressed="true"] { background: var(--ink); color: var(--paper); opacity: 1; }
    .fx.ok b { color: var(--green); }
    .fx.no b { color: var(--red); }
    .fx.wait b { color: #8A5A00; }
    .fx.free b { color: #4B5A6A; }
    .fx[aria-pressed="true"] b { color: inherit; }
    .fx.ok[aria-pressed="true"] { background: var(--green); color: #fff; }
    .fx.no[aria-pressed="true"] { background: var(--red); color: #fff; }
    .fx.wait[aria-pressed="true"] { background: #B7791F; color: #fff; }
    .fx.free[aria-pressed="true"] { background: #4B5A6A; color: #fff; }
    .bar-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

    .pay {
      flex: 0 0 auto; height: 36px; padding: 0 12px; border-radius: 999px; font-weight: 700; font-size: 14px;
      background: var(--red-bg); color: var(--red);
    }
    .pay.paid { background: var(--green-bg); color: var(--green); }
    .pay.requested { background: #FBEBC8; color: #8A5A00; }
    .pay.exempt { background: #E4E9EE; color: #4B5A6A; }
    .stsheet { padding-top: 14px; }
    .stscope { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; position: sticky; top: 0; background: var(--paper); z-index: 2; }
    .stscope::-webkit-scrollbar { display: none; }
    .stchip { flex: 0 0 auto; height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); font-weight: 700; font-size: 15px; white-space: nowrap; }
    .stchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .stkpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
    @media (min-width: 640px) { .stkpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .kpi { background: var(--cream); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
    .kpi b { font-family: "Rubik", sans-serif; font-size: 26px; line-height: 1.1; }
    .kpi span { font-weight: 700; font-size: 14px; }
    .kpi i { font-style: normal; font-size: 13px; color: var(--muted); }
    .kpi.good b { color: var(--green); } .kpi.warn b { color: #8A5A00; } .kpi.bad b { color: var(--red); }
    /* סולם ריווח אחיד: 4 / 8 / 12 / 16 */
    .stsec { background: #fff; border: 1.5px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 12px; }
    .stsec.flat { background: transparent; border: 0; padding: 4px 0 0; }   /* תובנות מרכזיות: בלי מסגרת ורקע */
    .stsec h3 { margin: 0 0 12px; font-family: "Rubik", sans-serif; font-size: 18px; line-height: 1.2; }
    .stsec h3:has(+ .sthint) { margin-bottom: 4px; }
    .sthint { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; line-height: 1.4; }
    .stsec p.stline { margin: 8px 0 0; font-size: 14.5px; }
    .insights { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr; gap: 8px; }
    @media (min-width: 640px) { .insights { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .insights li.ins { display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: var(--cream); border-radius: 18px; }
    .ins .ring { position: relative; flex: 0 0 auto; width: 58px; height: 58px; display: grid; place-items: center; }
    .ins .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .ins .ring b { position: relative; font-family: "Rubik", sans-serif; font-size: 15px; font-weight: 700; }
    .ins .trend { flex: 0 0 auto; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; align-content: center; gap: 0; }
    .ins .trend i { font-style: normal; font-size: 13px; line-height: 1; }
    .ins .trend b { font-family: "Rubik", sans-serif; font-size: 15px; font-weight: 700; line-height: 1.1; }
    .ins .trend.up { background: var(--green-bg); color: var(--green); } .ins .trend.down { background: var(--red-bg); color: var(--red); }
    .ins .itx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .ins .itx b { font-family: "Rubik", sans-serif; font-weight: 600; font-size: 16px; }
    .ins .itx span { color: var(--muted); font-size: 13.5px; line-height: 1.45; }
    .brow { display: grid; grid-template-columns: 92px 1fr auto; align-items: center; gap: 8px; margin: 7px 0; font-size: 14px; }
    .brow .bl { font-weight: 700; }
    .brow .bt { height: 12px; background: rgba(74,37,20,.08); border-radius: 999px; overflow: hidden; }
    .brow .bt i { display: block; height: 100%; border-radius: 999px; }
    .brow .bv { color: var(--muted); white-space: nowrap; font-size: 13.5px; } .brow .bv b { color: var(--ink); }
    .cols { display: flex; align-items: flex-end; gap: 4px; height: 118px; margin-top: 6px; }
    .cols .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; height: 100%; }
    .cols .col i { display: block; width: 100%; max-width: 30px; border-radius: 6px 6px 2px 2px; min-height: 2px; }
    .cols.dense { gap: 2px; }
    .cols.dense .cl { font-size: 9.5px; position: relative; }
    .cols .cv { font-size: 11.5px; font-weight: 700; color: var(--ink); min-height: 14px; }
    .cols .cl { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
    .sttable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .sttable th { text-align: right; color: var(--muted); font-weight: 700; font-size: 12px; padding: 4px 4px; }
    .sttable td { padding: 7px 4px; border-top: 1px solid var(--line); }
    .sttable td.num { font-family: "Rubik", sans-serif; font-weight: 600; }
    .up { color: var(--green); } .down { color: var(--red); }
    .ptabs { position: relative; display: flex; border-bottom: 1.5px solid var(--line); margin-bottom: 10px; }
    .ptab { flex: 1 1 0; height: 44px; font-weight: 700; font-size: 15px; color: var(--muted); position: relative; z-index: 1; transition: color .25s; background: none; }
    .ptab[hidden] { display: none; }
    .ptab { position: relative; z-index: 1; transition: color .25s; }
    .ptab[aria-selected="true"] { color: var(--ink); }
    .pind { position: absolute; z-index: 2; bottom: -1.5px; height: 3px; left: 0; width: 0; border-radius: 3px; background: var(--terra); pointer-events: none; will-change: transform, width; }
    /* גובה קבוע לפופאפ המשתתף בכל הלשוניות: הכותרת והלשוניות לא זזות, והתוכן נגלל בתוך הלשונית */
    #pDlg { height: min(84vh, 520px); overflow: visible; }
    #pDlg:focus { outline: none; }
    #pDlg .close, #pDlg .close:focus, #pDlg .close:focus-visible { outline: none; }   /* בלי מסגרת כהה סביב כפתור הסגירה */
    #pDlg .sheet { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; border-radius: inherit; overflow: hidden; padding: 30px 24px 24px; }
    /* כותרת (שם המשתתף) ממורכזת; כפתור הסגירה מרחף מעל הפופאפ במרכז, כמו בפופאפ ההרשמה באתר */
    #pDlg .sheet-head { position: relative; justify-content: center; text-align: center; min-height: 36px; }
    #pDlg .sheet-head .saved { position: absolute; left: 0; top: 50%; transform: translateY(-50%); }
    #pDlg .close { position: absolute; top: -3.5rem; left: 50%; margin-left: -22px; width: 44px; height: 44px; background: var(--paper); box-shadow: 0 4px 14px rgba(0,0,0,.25); font-size: 26px; }
    #pDlg .sheet-head, #pDlg .ptabs { flex: 0 0 auto; }
    #pDlg .pager { flex: 1 1 auto; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; }
    #pDlg .pager::-webkit-scrollbar { display: none; }
    #pDlg .ppanel { flex: 0 0 100%; height: 100%; box-sizing: border-box; scroll-snap-align: start; scroll-snap-stop: always; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain; padding: 4px 1px; }
    dialog, #pDlg .ppanel { scrollbar-width: none; }
    dialog::-webkit-scrollbar, #pDlg .ppanel::-webkit-scrollbar { display: none; }
    #pDlg #pSubmit { flex: 0 0 auto; margin-top: 10px; }
    .ppanel[hidden] { display: none; }
    .ptab[aria-selected="false"] .tcount { background: var(--muted); }
    .ptab .tcount { display: inline-block; min-width: 20px; height: 20px; line-height: 20px; padding: 0 5px; margin-inline-start: 4px; border-radius: 10px; background: var(--terra); color: #fff; font-size: 12px; font-weight: 700; text-align: center; vertical-align: 1px; }
    .ptab .tcount:empty { display: none; }
    .nform { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 14px; }
    .nform textarea { flex: 1 1 auto; min-width: 0; min-height: 46px; max-height: 140px; resize: none; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; padding: 10px 12px; font-size: 16px; line-height: 1.4; }
    .nform textarea:focus { border-color: var(--terra); outline: none; }
    #pDlg .nform .nadd { flex: 0 0 auto; width: auto; height: 46px; padding: 0 18px; margin: 0; font-size: 16px; }

  <dialog id="iDlg" aria-label="צילום מסך" style="max-width:520px">

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/supabase.js"></script>
  <script>
  /* הדאטהבייס של הדומיין (/supabase.js). המפתח ציבורי מעצם הגדרתו;
     מה שמותר באמת נקבע במדיניות RLS שב-businesses/aum/schema.sql */
  const DB = { url: window.SUPABASE.url, key: window.SUPABASE.anonKey };
  const T = { p: 'aum_participants', m: 'aum_events', a: 'aum_registrations', n: 'aum_notes', push: 'aum_push_subs' };
  /* בשפת המסך "ריטריט" הוא שורת aum_events (event_date, start_time) והשיוך הוא aum_registrations (event_id) */
  const toMeeting = (e) => ({ ...e, meeting_date: e.event_date, meeting_time: e.start_time });
  const toLink = (r) => ({ ...r, meeting_id: r.event_id });

  const state = { participants: [], meetings: [], att: [], notes: [], filter: null, q: '', pay: null, gender: null, sort: 'new' };
  /* קישור עמוק מהמייל: ?m=<ריטריט>&p=<משתתף>; נשמר בזמן הכניסה עם גוגל (שמחזירה בלי הפרמטרים) */
  let deep = null;
  try {
    const sp = new URLSearchParams(location.search);
    if (['m', 'p', 'pay', 'q', 'em', 'g', 's', 'st', 'pt'].some((k) => sp.get(k))) { deep = { m: sp.get('m'), p: sp.get('p'), pay: sp.get('pay'), q: sp.get('q'), em: sp.get('em'), g: sp.get('g'), s: sp.get('s'), st: sp.get('st'), pt: sp.get('pt') }; sessionStorage.setItem('aum_deep', JSON.stringify(deep)); }
    else { deep = JSON.parse(sessionStorage.getItem('aum_deep') || 'null'); }
  } catch (e) {}
  const $ = (s) => document.querySelector(s);

  /* מצב המסך נשמר ב-URL (ריטריט, סינון תשלום, חיפוש, חלון פתוח) כדי שאפשר יהיה לשתף */
  let urlReady = false, openPid = null;
  function syncUrl() {
    if (!urlReady) return;
    const sp = new URLSearchParams();
    if (state.filter) sp.set('m', state.filter);
    if (state.pay) sp.set('pay', state.pay);
    if (state.gender) sp.set('g', state.gender);
    if (state.sort !== 'new') sp.set('s', state.sort);
    if (state.q.trim()) sp.set('q', state.q.trim());
    if (openPid) { sp.set('p', openPid); if (pTab !== 'contact') sp.set('pt', pTab); }
    if (editingMeeting && mDlg.open) sp.set('em', editingMeeting.id);
    if ($('#stDlg').open) sp.set('st', '1');
    const s = sp.toString();
    try { history.replaceState(null, '', location.pathname + (s ? '?' + s : '')); } catch (e) {}
  }

  /* ---------- כניסה עם גוגל (הזדהות של floa ב-Supabase, בלי SDK) ---------- */
  const ADMINS = ['ofir.aviram@gmail.com', 'tal.amitai1@gmail.com'];            // תצוגה בלבד; האכיפה האמיתית ב-RLS (schema.sql, טבלת aum_admins)
  const SKEY = 'aum_admin_session_v1';
  let session = null;
  const jwtData = (tok) => { try { return JSON.parse(decodeURIComponent(escape(atob(tok.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) { return {}; } };
  const saveSession = (s) => { session = s; try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch (e) {} };
  const clearSession = () => { session = null; try { localStorage.removeItem(SKEY); } catch (e) {} };
  const sessionOk = (s) => s && s.access_token && (jwtData(s.access_token).exp || 0) * 1000 > Date.now() + 30000;
  async function refreshSession() {
    if (!session || !session.refresh_token) return false;
    try {
      const r = await fetch(DB.url + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: DB.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: session.refresh_token }) });
      if (!r.ok) return false;
      const d = await r.json(); saveSession({ access_token: d.access_token, refresh_token: d.refresh_token });
      if (typeof rtSend === 'function') rtSend({ topic: RT_TOPIC, event: 'access_token', payload: { access_token: d.access_token }, ref: String(Date.now()) });
      return true;
    } catch (e) { return false; }
  }
  const emailOf = () => String((session && jwtData(session.access_token).email) || '').toLowerCase();
  const gateMsg = (m) => { $('#gErr').textContent = m || ''; };
  function showGate(msg, canSwitch) {
    document.body.classList.add('locked'); $('#gate').hidden = false; gateMsg(msg); $('#gOut').hidden = !canSwitch;
  }
  /* ---------- זמן אמת (Supabase Realtime, WebSocket ישיר בלי SDK) ----------
     כל שינוי בטבלאות (מהטופס באתר, מהדר או מכל מכשיר אחר) מרענן את המסך. דורש שהטבלאות ב-publication (admin/realtime.sql) */
  let rtWs = null, rtHb = 0, rtRetry = 1000, rtDebounce = 0, rtAlive = false;
  const RT_TOPIC = 'realtime:aum';
  const rtSend = (o) => { if (rtWs && rtWs.readyState === 1) rtWs.send(JSON.stringify(o)); };
  function scheduleRefresh() { clearTimeout(rtDebounce); rtDebounce = setTimeout(() => load(true), 350); }
  function startRealtime() {
    if (!session || rtWs) return;
    let ws;
    try { ws = new WebSocket(DB.url.replace(/^http/, 'ws') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(DB.key) + '&vsn=1.0.0'); } catch (e) { return; }
    rtWs = ws;
    ws.onopen = () => {
      rtRetry = 1000;
      rtSend({ topic: RT_TOPIC, event: 'phx_join', ref: '1', payload: { config: { broadcast: { ack: false, self: false }, presence: { key: '' }, private: false,
        postgres_changes: [T.p, T.m, T.a, T.n].map((table) => ({ event: '*', schema: 'public', table })) }, access_token: session.access_token } });
      rtHb = setInterval(() => rtSend({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(Date.now()) }), 25000);
    };
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.event === 'phx_reply' && m.topic === RT_TOPIC && m.ref === '1') {
        rtAlive = m.payload && m.payload.status === 'ok';
        if (rtAlive) scheduleRefresh();   // מה שהוחמץ בזמן שהחיבור היה סגור
      } else if (m.event === 'postgres_changes') scheduleRefresh();
      else if (m.event === 'system' && m.payload && m.payload.status === 'error') { rtAlive = false; }
    };
    ws.onclose = () => {
      clearInterval(rtHb); rtWs = null; rtAlive = false;
      if (session) setTimeout(startRealtime, rtRetry), rtRetry = Math.min(rtRetry * 2, 30000);
    };
    ws.onerror = () => { try { ws.close(); } catch (x) {} };
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && session) { load(true); if (!rtWs) startRealtime(); } });

  async function startAuth() {
    const h = new URLSearchParams(location.hash.replace(/^#/, ''));
    if (h.get('access_token')) {
      saveSession({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token') });
      history.replaceState(null, '', location.pathname + location.search);
    } else if (h.get('error_description')) {
      history.replaceState(null, '', location.pathname + location.search);
      showGate('הכניסה נכשלה: ' + h.get('error_description').replace(/\+/g, ' ')); return;
    } else {
      try { session = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { session = null; }
    }
    if (session && !sessionOk(session) && !(await refreshSession())) clearSession();
    if (!session) { showGate(''); return; }
    if (!ADMINS.includes(emailOf())) { showGate('אין הרשאה לחשבון ' + emailOf(), true); return; }
    document.body.classList.remove('locked'); $('#gate').hidden = true;
    load();
    startRealtime();
    pushState(); refreshSub();
  }

  async function api(path, { method = 'GET', body, prefer } = {}) {
    const headers = { apikey: DB.key, Authorization: 'Bearer ' + ((session && session.access_token) || DB.key) };
    if (body) headers['Content-Type'] = 'application/json';
    if (prefer) headers.Prefer = prefer;
    let res = await fetch(DB.url + '/rest/v1/' + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    if (res.status === 401 && session && await refreshSession()) {
      headers.Authorization = 'Bearer ' + session.access_token;
      res = await fetch(DB.url + '/rest/v1/' + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    }
    const text = await res.text();
    const data = text ? JSON.parse(text) : null;
    if (!res.ok) {
      const err = new Error((data && data.message) || ('HTTP ' + res.status));
      err.code = data && data.code;
      throw err;
    }
    return data;
  }

  /* ---------- עזרים ---------- */
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const digits = (s) => String(s || '').replace(/\D/g, '');
  const todayISO = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };

  /* גיל מוצג = הגיל שהוקלד + שנים מלאות מאז שהוקלד */
  function shownAge(p) {
    if (p.age == null) return null;
    const [y, m, d] = String(p.age_set_at || todayISO()).split('-').map(Number);
    const now = new Date();
    let years = now.getFullYear() - y;
    if (now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) years--;
    return p.age + Math.max(0, years);
  }

  const CALL_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>';
  /* קישור שיחה (tel:) בפורמט בינלאומי; מספר ישראלי מקומי הופך ל-+972 */
  function telLink(phone) {
    const raw = String(phone || '').trim();
    let n = digits(raw);
    if (!n) return null;
    if (raw.startsWith('+')) return 'tel:+' + n;
    if (n.startsWith('00')) return 'tel:+' + n.slice(2);
    if (n.startsWith('0')) return 'tel:+972' + n.slice(1);
    if (n.length === 9) return 'tel:+972' + n;
    return 'tel:+' + n;
  }
  /* תאריך הרשמה/יצירה (created_at), בשעון ישראל: 5.10.26 */
  function regDate(p) {
    if (!p.created_at) return '';
    const d = new Date(p.created_at); if (isNaN(d)) return '';
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Jerusalem', day: 'numeric', month: 'numeric', year: '2-digit' }).formatToParts(d);
    const g = (k) => parts.find((x) => x.type === k).value;
    return g('day') + '.' + g('month') + '.' + g('year');
  }
  /* תאריך ושעה (שעון ישראל), למשל 11.10.26 בשעה 20:35 */
  function regDateTime(p) {
    const base = regDate(p); if (!base) return '';
    const tm = new Intl.DateTimeFormat('he-IL', { timeZone: 'Asia/Jerusalem', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(p.created_at));
    return base + ' בשעה ' + tm;
  }
  function waLink(phone) {
    let n = digits(phone);
    if (!n) return null;
    if (n.startsWith('0')) n = '972' + n.slice(1);
    else if (n.length === 9) n = '972' + n;
    return 'https://wa.me/' + n;
  }

  /* מספר ישראלי בפורמט בינלאומי (+972...) מוצג כמספר מקומי שמתחיל באפס */
  function localPhone(phone) {
    const s = String(phone || '').trim(), d = digits(s);
    return /^\+?972\d{8,9}$/.test(s.replace(/[\s-]/g, '')) ? '0' + d.slice(3) : s;
  }

  const phoneHay = (p) => digits(p.phone) + ' ' + digits(localPhone(p.phone));   // חיפוש גם לפי 05... וגם לפי 972...

  /* ולידציה ונרמול טלפון (זהה ללוגיקה באתר ול-harpatka_normalize_phone): ריק, או מספר ישראלי / בינלאומי תקין */
  function normPhone(raw) {
    const s = String(raw || '').trim();
    if (!s) return '';
    let plus = s[0] === '+', d = s.replace(/\D/g, '');
    if (!d) return '';
    if (d.startsWith('00')) { plus = true; d = d.slice(2); }
    const IL = /^(5\d{8}|7\d{8}|[23489]\d{7})$/;
    if (plus) {
      if (d.startsWith('9720')) d = '972' + d.slice(4);
      if (d.length < 8 || d.length > 15 || d[0] === '0') return '';
      if (d.startsWith('972') && !IL.test(d.slice(3))) return '';
      return '+' + d;
    }
    if (d[0] === '0') return IL.test(d.slice(1)) ? '+972' + d.slice(1) : '';
    return '';
  }
  /* מחזיר את הערך לשמירה (ישראלי: 05XXXXXXXX), '' לריק, או null אם לא תקין */
  function phoneToSave(raw) {
    if (!String(raw || '').trim()) return '';
    const n = normPhone(raw);
    return n ? localPhone(n) : null;
  }
  function badPhone(on) {
    pForm.phone.style.borderColor = on ? 'var(--red)' : '';
    if (on) { toast('מספר הטלפון לא תקין'); pForm.phone.focus(); }
  }

  function fmtPhone(phone) {
    const n = digits(phone);
    if (n.length === 10 && n.startsWith('0')) return n.slice(0, 3) + ' ' + n.slice(3, 6) + ' ' + n.slice(6);
    return phone || '';
  }

  const DAYS = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
  function meetingLabel(m, withDay) {
    const [y, mo, d] = m.meeting_date.split('-').map(Number);
    const day = DAYS[new Date(y, mo - 1, d).getDay()];
    return (withDay ? 'יום ' + day + ' ' : '') + d + '.' + mo + ' · ' + String(m.meeting_time).slice(0, 5);
  }
  const isPast = (m) => m.meeting_date < todayISO();
  const sortMeetings = () => state.meetings.sort((a, b) => (b.meeting_date + b.meeting_time).localeCompare(a.meeting_date + a.meeting_time));   // מהחדש לישן

  const linksOf = (pid) => state.att.filter((a) => a.participant_id === pid);
  const linkOf = (pid, mid) => state.att.find((a) => a.participant_id === pid && a.meeting_id === mid);

  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
  }
  function fail(err) {
    console.error(err);
    toast('משהו השתבש, לא נשמר. נסו שוב');
  }

  /* ---------- טעינה ---------- */
  async function load(silent) {
    if (!silent) $('#status').innerHTML = '<div class="empty">טוען…</div>';
    try {
      const [p, m, a, nn] = await Promise.all([
        api(T.p + '?select=*'),
        api(T.m + '?select=*'),
        api(T.a + '?select=participant_id,event_id,status,paid,pay_requested_at,created_at,exempt'),
        api(T.n + '?select=id,participant_id,body,author_email,author_name,created_at,has_image&order=created_at.desc'),
      ]);
      state.participants = p; state.meetings = m.map(toMeeting); state.att = a.map(toLink); state.notes = nn; rebuildNotes();
      sortMeetings();
      if (!silent) $('#status').innerHTML = '';
      if (deep) {
        const d = deep; deep = null;
        try { sessionStorage.removeItem('aum_deep'); } catch (e) {}
        if (d.m && state.meetings.some((x) => x.id === d.m)) state.filter = d.m;
        if (['paid', 'unpaid', 'requested'].includes(d.pay)) state.pay = d.pay;
        if (d.g === 'male' || d.g === 'female' || d.g === 'none') state.gender = d.g;
        if (d.s && SORTS.some((x) => x[0] === d.s)) state.sort = d.s;
        if (d.q) { state.q = d.q; $('#q').value = d.q; }
        urlReady = true;
        render();
        if (d.p && state.participants.some((x) => x.id === d.p)) openParticipant(d.p, ['meets', 'contact', 'info'].includes(d.pt) ? d.pt : 'contact');
        else if (d.em && state.meetings.some((x) => x.id === d.em)) openMeeting(d.em);
        else if (d.st) { renderStats(); $('#stDlg').showModal(); syncUrl(); }
        return;
      }
      urlReady = true;
      render();

  function sortCmp() {
    const byNew = (a, b) => String(b.created_at || '').localeCompare(String(a.created_at || ''));
    const byName = (a, b) => a.name.localeCompare(b.name, 'he');
    const ageOf = (p) => { const x = shownAge(p); return x == null ? null : x; };
    const byAge = (dir) => (a, b) => { const x = ageOf(a), y = ageOf(b); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return dir * (x - y); };

      case 'old': return (a, b) => -byNew(a, b) || byName(a, b);

      case 'age_asc': return (a, b) => byAge(1)(a, b) || byNew(a, b);
      case 'age_desc': return (a, b) => byAge(-1)(a, b) || byNew(a, b);

  function computeStats() {

    const links = all;
    // לכל ריטריט: נרשמים, שילמו, הכנסה, חדשים/חוזרים, שימור מהריטריט הקודם
    const seen = new Set(); let prev = new Set();
    const perMeeting = asc.map((m) => {
      const ls = all.filter((l) => l.meeting_id === m.id), S = new Set(ls.map((l) => l.participant_id));
      const ret = [...S].filter((id) => seen.has(id)).length, kept = [...S].filter((id) => prev.has(id)).length;
      const row = { m, regs: ls.length, ad: ls.filter((l) => l.p.source === 'site-ad').length, ex: ls.filter((l) => l.exempt).length, paid: ls.filter((l) => l.paid && !l.exempt).length, rev: ls.filter((l) => l.paid && !l.exempt).reduce((s, l) => s + priceAtReg(m, l.created_at), 0),
        news: S.size - ret, ret, kept, prevN: prev.size };
      S.forEach((id) => seen.add(id)); prev = S;

    });
    return { asc, links, all, perMeeting };
  }

  const kpi = (v, label, sub, tone) => '<div class="kpi ' + (tone || '') + '"><b>' + v + '</b><span>' + label + '</span>' + (sub ? '<i>' + sub + '</i>' : '') + '</div>';
  const sec = (title, hint, body) => '<section class="stsec"><h3>' + title + '</h3>' + (hint ? '<p class="sthint">' + hint + '</p>' : '') + body + '</section>';
  const barRow = (label, n, total, color, extra) => { const w = total ? Math.round(n / total * 100) : 0; return '<div class="brow"><span class="bl">' + label + '</span><span class="bt"><i style="width:' + w + '%;background:' + color + '"></i></span><span class="bv"><b>' + n + '</b>' + (total ? ' · ' + w + '%' : '') + (extra ? ' · ' + extra : '') + '</span></div>'; };
  const colsChart = (items, color, dense) => { const max = Math.max(1, ...items.map((i) => i.v)); return '<div class="cols' + (dense ? ' dense' : '') + '">' + items.map((i) => '<div class="col">' + (dense ? '' : '<span class="cv">' + (i.v || '') + '</span>') + '<i style="height:' + Math.round(i.v / max * 72) + 'px;background:' + (i.color || color) + '"></i><span class="cl">' + i.l + '</span></div>').join('') + '</div>'; };
  const median = (a) => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };

  function renderStats() {
    const S = computeStats(), links = S.links;   // תמיד התמונה הכוללת של כל הריטריטים

    const n = links.length, uniq = new Set(links.map((l) => l.participant_id)), people = [...uniq].map((id) => state.participants.find((x) => x.id === id));

    const SRC = { site: ['אתר (אורגני)', '#5A2410'], ad: ['מודעה ממומנת', '#C1191F'], other: ['ידני או אחר', '#C9B79C'] };

    const adN = links.filter((l) => src(l.p) === 'ad').length;

    const pm = S.perMeeting.filter((r) => r.regs);
    if (pm.length >= 2) { const a = pm[pm.length - 1], b = pm[pm.length - 2], ch = P(a.regs - b.regs, b.regs) || 0, up = a.regs >= b.regs;
      ins.push(insItem('<span class="trend ' + (up ? 'up' : 'down') + '"><i>' + (up ? '▲' : '▼') + '</i><b>' + Math.abs(ch) + '%</b></span>', 'הריטריט האחרון ' + (up ? 'בעלייה' : 'בירידה'), a.regs + ' נרשמים לעומת ' + b.regs + ' בריטריט שלפניו')); }

    // ---- מדדים ראשיים ----

    kp.push(kpi(adLinks.length, 'הגיעו מפרסום ממומן', Ps(adLinks.length, n) + ' מההרשמות' + (adLinks.length ? ' · ' + adPaidN + ' שילמו' : '')));
    kp.push(kpi(paid.length, 'שילמו', Ps(paid.length, nPay) + ' ממי שמשלמים', 'good'));
    kp.push(kpi(req.length, 'בבדיקה', Ps(req.length, nPay), 'warn'));

      const tb = [['בוקר 6 עד 12', (h) => h >= 6 && h < 12], ['צהריים 12 עד 17', (h) => h >= 12 && h < 17], ['ערב 17 עד 22', (h) => h >= 17 && h < 22], ['לילה 22 עד 6', (h) => h >= 22 || h < 6]];

    }

    // ---- ציר זמן ----
    {
      const pmr = S.perMeeting.filter((r) => r.regs);

      // הרשמות לפי יום על ציר הזמן (ימי ריטריט בסגול)
      const byDay = new Map(); regs.forEach((x) => { const d = dnum(ilDay(x.created_at)); byDay.set(d, (byDay.get(d) || 0) + 1); });
      if (byDay.size) {
        const lastD = Math.max(dnum(todayISO()), ...byDay.keys()), from = Math.max(Math.min(...byDay.keys()), lastD - 44);
        const mdays = new Set(S.asc.map((m) => dnum(m.meeting_date))), dl = (d) => { const x = new Date(d * 864e5); return x.getUTCDate() + '.' + (x.getUTCMonth() + 1); };
        const items = []; for (let d = from; d <= lastD; d++) items.push({ l: ((d - from) % 6 === 0 || mdays.has(d)) ? dl(d) : '', v: byDay.get(d) || 0, color: mdays.has(d) ? '#4A1F10' : '#C1191F', dense: true });
        const total = items.reduce((s, x) => s + x.v, 0), peak = items.slice().sort((a, b) => b.v - a.v)[0];
        out.push(sec('הרשמות לאורך זמן', 'כל יום, עד 45 הימים האחרונים. בסגול: ימי ריטריט', colsChart(items, '#C1191F', true) + '<p class="stline">' + total + ' הרשמות בתקופה, ממוצע <b>' + (total / items.length).toFixed(1) + '</b> ליום' + (peak && peak.v ? ' · היום החזק: <b>' + peak.l.replace(/^$/, '') + '</b>' : '') + '</p>'));
      }
      // קצב הרשמה מצטבר לפני כל ריטריט, מונח זה על זה

        const X = (i) => (W - 6) - (i / 14) * (W - 12), Y = (v) => H - 4 - (v / maxY) * (H - 12);   // ימין = 14 ימים לפני, שמאל = יום הריטריט

        const grid = [0, .5, 1].map((f) => '<line x1="0" x2="' + W + '" y1="' + Y(maxY * f).toFixed(1) + '" y2="' + Y(maxY * f).toFixed(1) + '" stroke="rgba(74,37,20,.12)"/>').join('');

      }

        pmr.slice().reverse().map((r, i, arr) => { const b = arr[i + 1]; const tr = b ? (r.regs > b.regs ? ' <span class="up">▲</span>' : r.regs < b.regs ? ' <span class="down">▼</span>' : '') : ''; return '<tr><td>' + esc(dm(r.m)) + '</td><td class="num">' + r.regs + tr + '</td><td class="num">' + r.ad + '</td><td class="num">' + r.paid + '</td><td class="num">' + Ps(r.paid, r.regs - r.ex) + '</td><td class="num">' + r.news + '/' + r.ret + '</td><td class="num">₪' + nfm(r.rev) + '</td></tr>'; }).join('') + '</table>';
      out.push(sec('הריטריטים לאורך זמן', 'כל ריטריט, מהחדש לישן. החצים משווים לריטריט הקודם', colsChart(pmr.map((r) => ({ l: dm(r.m), v: r.regs })), '#5A2410') + tb));
      // נאמנות

      const kept = pmr.filter((r) => r.prevN);
      out.push(sec('נאמנות וחזרה', 'האם אנשים חוזרים מריטריט לריטריט', barRow('נרשמו ליותר מריטריט אחד', rep2, per.size, '#3F6FB5') + '<p class="stline">ממוצע ריטריטים לאדם: <b>' + (S.all.length / Math.max(1, per.size)).toFixed(2) + '</b>' + (kept.length ? ' · שימור ממוצע בין ריטריטים עוקבים: <b>' + Ps(kept.reduce((a, r) => a + r.kept, 0), kept.reduce((a, r) => a + r.prevN, 0)) + '</b>' : '') + '</p>' +
        colsChart(pmr.map((r) => ({ l: dm(r.m), v: r.ret, color: '#3F6FB5' })), '#3F6FB5') + '<p class="sthint">כחול: חוזרים לכל ריטריט. החדשים: ' + pmr.map((r) => dm(r.m) + ' ' + r.news).join(' · ') + '</p>'));

      const wk = (arr, f) => { const m = new Map(); arr.forEach((x) => { const dn = dnum(ilDay(f(x))); const ws = dn - wdayOf(dn); m.set(ws, (m.get(ws) || 0) + 1); }); return m; };

    refreshSheetMeetings();
    openPid = p ? p.id : null;
    pDlg.showModal();
    pDlg.setAttribute('tabindex', '-1'); pDlg.focus({ preventScroll: true });   // בלי טבעת פוקוס על כפתור הסגירה
    setPTab(p ? (tab || lastTab() || 'contact') : 'info', true);
    requestAnimationFrame(() => setPTab(pTab, true));
    if (!p) setTimeout(() => pForm.name.focus(), 50);
  }

  function refreshSheetMeetings() {
    if (!sheet) return;
    { const n = sheet.id ? linksOf(sheet.id).length : sheet.links.size, el = $('#pTabs [data-tab="meets"] .tcount'); if (el) el.textContent = n ? n : ''; moveInd(true); }
    renderContact();
    const box = $('#pMeetings');
    box.innerHTML = state.meetings.map((m) => {
      let on, st;
      if (sheet.id) { const l = linkOf(sheet.id, m.id); on = !!l; st = l ? linkStatus(l) : 'unpaid'; }
      else { on = sheet.links.has(m.id); st = sheet.links.get(m.id) ? 'paid' : 'unpaid'; }
      return '<div class="mrow' + (on ? ' on' : '') + '">' +
        '<button type="button" class="mtoggle" data-mt="' + m.id + '" aria-pressed="' + on + '"><span class="box">' + (on ? '✓' : '') + '</span>' + esc(meetingLabel(m, true)) + '</button>' +
        '<button type="button" class="pay ' + st + '" data-mp="' + m.id + '"' + (on ? '' : ' hidden') + '>' + STATUS_LABEL[st] + '</button>' +
      '</div>';
    }).join('');
  }

  $('#pMeetings').addEventListener('click', (e) => {
    const t = e.target.closest('[data-mt]'), pay = e.target.closest('[data-mp]');
    if (t) {
      const mid = t.dataset.mt, on = t.getAttribute('aria-pressed') !== 'true';
      if (sheet.id) confirmLink(sheet.id, mid, on);
      else { on ? sheet.links.set(mid, false) : sheet.links.delete(mid); refreshSheetMeetings(); }
    } else if (pay) {
      const mid = pay.dataset.mp;
      if (sheet.id) pickPayStatus(sheet.id, mid);
      else { sheet.links.set(mid, !sheet.links.get(mid)); refreshSheetMeetings(); }
    }
  });

  function readForm() {
    const age = parseInt(pForm.age.value, 10);
    return {
      name: pForm.name.value.trim(),
      phone: pForm.phone.value.trim(),
      age: Number.isFinite(age) ? age : null,
      gender: pForm.gender.value || null,
    };
  }

  /* עריכה: שמירה אוטומטית של כל שדה ששונה */
  let savedTimer;
  pForm.addEventListener('change', async (e) => {
    if (!sheet || !sheet.id || !e.target.name) return;
    const p = state.participants.find((x) => x.id === sheet.id);
    const v = readForm();
    const field = e.target.name;
    if (field === 'name' && !v.name) { pForm.name.value = p.name; return; }
    if (field === 'phone') {
      const ph = phoneToSave(pForm.phone.value);
      if (ph === null) { badPhone(true); return; }
      v.phone = ph; pForm.phone.value = ph;
    }
    const patch = { [field]: v[field] };
    if (field === 'age') patch.age_set_at = todayISO();
    const prev = { ...p };
    Object.assign(p, patch); render();
    if (field === 'name') $('#pTitle').textContent = p.name;
    try {
      await api(T.p + '?id=eq.' + p.id, { method: 'PATCH', body: patch });
      const mark = $('#savedMark');
      mark.classList.add('on'); clearTimeout(savedTimer);
      savedTimer = setTimeout(() => mark.classList.remove('on'), 1500);
    } catch (err) { Object.assign(p, prev); render(); fail(err); }
  });

  /* משתתף חדש */
  pForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!sheet || sheet.id) { pDlg.close(); return; }
    const v = readForm();
    if (!v.name) { pForm.name.focus(); toast('חסר שם'); return; }
    const ph = phoneToSave(pForm.phone.value);
    if (ph === null) { badPhone(true); return; }
    v.phone = ph;
    const btn = $('#pSubmit'); btn.disabled = true;
    try {
      const [p] = await api(T.p, { method: 'POST', body: { ...v, age_set_at: todayISO() }, prefer: 'return=representation' });
      state.participants.push(p);
      const rows = [...sheet.links].map(([mid, paid]) => ({ participant_id: p.id, event_id: mid, paid: !!paid }));
      if (rows.length) { await api(T.a, { method: 'POST', body: rows }); state.att.push(...rows.map(toLink)); }
      pDlg.close(); render(); toast('✓ ' + p.name + ' ברשימה');
    } catch (err) { fail(err); }
    btn.disabled = false;
  });

  $('#pDelete').addEventListener('click', async () => {
    const p = state.participants.find((x) => x.id === sheet.id);
    if (!p || !confirm('למחוק את ' + p.name + '?')) return;
    try {
      await api(T.p + '?id=eq.' + p.id, { method: 'DELETE' });
      state.participants = state.participants.filter((x) => x !== p);
      state.att = state.att.filter((a) => a.participant_id !== p.id);
      pDlg.close(); render(); toast('נמחק');
    } catch (err) { fail(err); }
  });

  /* ---------- חלון ריטריט ---------- */
  const mDlg = $('#mDlg'), mForm = $('#mForm');
  let editingMeeting = null;

  function openMeeting(id) {
    const m = id ? state.meetings.find((x) => x.id === id) : null;
    editingMeeting = m;
    mForm.date.value = m ? m.meeting_date : '';
    mForm.time.value = m ? String(m.start_time).slice(0, 5) : '09:00';
    mForm.to.value = m ? String(m.end_time).slice(0, 5) : '16:00';
    mForm.location.value = m ? m.location : 'בית כאן ועכשיו, פינס 44, גדרה';
    mForm.price.value = m && m.price != null ? m.price : '';
    mForm.pair.value = m && m.price_pair != null ? m.price_pair : '';
    mForm.capacity.value = m && m.capacity != null ? m.capacity : '';
    $('#mTitle').textContent = m ? 'עריכת ריטריט' : 'ריטריט חדש';
    $('#mSubmit').textContent = m ? 'שמירה' : 'יצירת ריטריט';
    $('#mDelete').hidden = !m;
    mDlg.showModal();
    syncUrl();
  }

  mForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const num = (v) => (v === '' ? null : Number(v));
    const body = { event_date: mForm.date.value, start_time: mForm.time.value || '09:00', end_time: mForm.to.value || '16:00',
      location: mForm.location.value.trim() || 'גדרה', price: num(mForm.price.value), price_pair: num(mForm.pair.value), capacity: num(mForm.capacity.value) };
    if (!body.event_date) { mForm.date.focus(); toast('חסר תאריך'); return; }
    const btn = $('#mSubmit'); btn.disabled = true;
    try {
      if (editingMeeting) {
        await api(T.m + '?id=eq.' + editingMeeting.id, { method: 'PATCH', body });
        Object.assign(editingMeeting, toMeeting(body));
      } else {
        const [m] = await api(T.m, { method: 'POST', body, prefer: 'return=representation' });
        state.meetings.push(toMeeting(m));
        state.filter = m.id;
      }
      sortMeetings(); mDlg.close(); render();
    } catch (err) { fail(err); }
    btn.disabled = false;
  });

  $('#mDelete').addEventListener('click', async () => {
    const m = editingMeeting;
    const n = state.att.filter((a) => a.meeting_id === m.id).length;
    if (!confirm('למחוק את הריטריט ' + meetingLabel(m) + '?' + (n ? '\n' + n + ' משתתפים ינותקו ממנו (הם עצמם לא יימחקו)' : ''))) return;
    try {
      await api(T.m + '?id=eq.' + m.id, { method: 'DELETE' });
      state.meetings = state.meetings.filter((x) => x !== m);
      state.att = state.att.filter((a) => a.meeting_id !== m.id);
      state.filter = null; mDlg.close(); render();
    } catch (err) { fail(err); }
  });

  /* ---------- אירועים כלליים ---------- */
  pDlg.addEventListener('close', () => { sheet = null; openPid = null; syncUrl(); });
  mDlg.addEventListener('close', syncUrl);
  pForm.phone.addEventListener('input', () => badPhone(false));

  $('#qClear').addEventListener('mousedown', (e) => e.preventDefault());
  $('#qClear').addEventListener('click', () => { const q = $('#q'); q.value = ''; state.q = ''; renderList(); syncUrl(); q.focus(); });
  $('#q').addEventListener('input', (e) => { state.q = e.target.value; renderList(); syncUrl(); });
  $('#addBtn').addEventListener('click', () => (state.filter ? openMeeting(state.filter) : openParticipant(null)));

  $('#mMenu').addEventListener('click', (e) => {
    if (e.target.closest('#addMeeting')) { closeMSel(); return openMeeting(null); }
    const c = e.target.closest('[data-filter]');
    if (!c) return;
    closeMSel();
    state.filter = c.dataset.filter || null;
    render();
  });
  $('#list').addEventListener('click', (e) => { if (e.target.closest('#clearFx')) { state.gender = null; state.pay = null; render(); } });
  $('#facets').addEventListener('click', (e) => {
    const b = e.target.closest('[data-fx]'); if (!b) return;
    const [k, v] = b.dataset.fx.split(':');
    if (k === 'g') state.gender = state.gender === v ? null : v;
    else state.pay = state.pay === v ? null : v;
    render();
  });

  $('#list').addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-edit]')) { e.preventDefault(); openParticipant(e.target.dataset.edit, undefined, e.target.closest('li.row')); }
  });
  $('#list').addEventListener('click', (e) => {
    const am = e.target.closest('[data-addm]');
    if (am) { confirmLink(am.dataset.addm, state.filter, true, () => { state.q = ''; $('#q').value = ''; renderList(); toast('נוסף לריטריט'); }); return; }
    if (e.target.closest('#addNew')) {
      const q = state.q.trim(); openParticipant(null);
      if (digits(q).length >= 6) pForm.phone.value = q; else pForm.name.value = q;
      return;
    }
    const row = e.target.closest('li.row'), ed = row && row.querySelector('[data-edit]');   // לחיצה בכל מקום בכרטיס פותחת את פרטי המשתתף
    if (ed) openParticipant(ed.dataset.edit, undefined, row);
  });


  /* ---------- התראות דפדפן על הרשמה חדשה (Web Push) ----------
     הפעמון מבקש רשות, נרשם ל-push מול המפתח הציבורי של ה-Worker (aum_push_key) ושומר את
     הדפדפן ב-aum_push_subs. כשמישהו נרשם, ה-Worker דוחף ו-sw.js מציג את ההתראה. בכל מכשיר ודפדפן בנפרד. */
  const pushOk = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const keyBytes = (k) => Uint8Array.from(atob(k.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
  const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  async function pushReg() { return navigator.serviceWorker.register('sw.js', { scope: './' }).then(() => navigator.serviceWorker.ready); }
  async function pushState() {
    const btn = $('#pushBtn');
    if (!pushOk) { btn.hidden = false; btn.setAttribute('aria-pressed', 'false'); return; }
    btn.hidden = false;
    let on = false;
    try { const reg = await navigator.serviceWorker.getRegistration('./'); on = !!(reg && await reg.pushManager.getSubscription()) && Notification.permission === 'granted'; } catch (e) {}
    btn.setAttribute('aria-pressed', String(on));
    btn.title = on ? 'התראות פועלות בדפדפן הזה. לחיצה מכבה' : 'להפעלת התראות על הרשמות חדשות';
  }
  async function saveSub(sub) {
    const j = sub.toJSON();
    await api(T.push, { method: 'POST', body: { endpoint: j.endpoint, p256dh: (j.keys && j.keys.p256dh) || '', auth: (j.keys && j.keys.auth) || '', email: emailOf() }, prefer: 'resolution=merge-duplicates' });
  }
  async function togglePush() {
    if (!pushOk) { toast('הדפדפן הזה לא תומך בהתראות. באייפון צריך קודם להוסיף את הדף למסך הבית'); return; }
    const reg = await pushReg();
    const cur = await reg.pushManager.getSubscription();
    if (cur && Notification.permission === 'granted') {
      try { await api(T.push + '?endpoint=eq.' + encodeURIComponent(cur.endpoint), { method: 'DELETE' }); } catch (e) {}
      await cur.unsubscribe(); toast('ההתראות כובו בדפדפן הזה'); return pushState();
    }
    if (Notification.permission === 'denied') { toast('ההתראות חסומות בדפדפן. אפשר לאשר אותן בהגדרות האתר'); return; }
    if (await Notification.requestPermission() !== 'granted') { toast('לא אושרו התראות'); return; }
    let key;
    try { key = await fetch(DB.url + '/rest/v1/rpc/aum_push_key', { method: 'POST', headers: { apikey: DB.key, Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json' }, body: '{}' }).then((r) => r.json()); } catch (e) {}
    if (!key || typeof key !== 'string') { toast('ההתראות עוד לא הוגדרו בשרת'); return; }
    const sub = cur || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(key) });
    await saveSub(sub);
    toast('התראות על הרשמות חדשות פועלות בדפדפן הזה'); pushState();
  }
  $('#pushBtn').addEventListener('click', () => togglePush().catch((err) => { console.error(err); toast('לא הצלחנו להפעיל התראות'); }));
  /* מי שכבר הפעיל: מרעננים את השמירה (הכתובת של הדפדפן יכולה להתחלף) */
  async function refreshSub() {
    if (!pushOk || Notification.permission !== 'granted') return;
    try { const reg = await navigator.serviceWorker.getRegistration('./'); const sub = reg && await reg.pushManager.getSubscription(); if (sub) await saveSub(sub); } catch (e) {}
  }

  const goGoogle = () => { location.href = DB.url + '/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent(location.origin + location.pathname); };
  $('#gLogin').addEventListener('click', goGoogle);
  const signOut = () => { clearSession(); try { if (rtWs) rtWs.close(); } catch (e) {} location.reload(); };
  $('#gOut').addEventListener('click', signOut);
  $('#signOut').addEventListener('click', signOut);
  startAuth();
  </script>
</body>
</html>
