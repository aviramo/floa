<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>העסקים שלי | צ'אט</title>
<style>
:root { --bg: #f6f1ea; --paper: #fffdf9; --ink: #2a211b; --muted: #7b6e63; --line: #e3d9cc; --accent: #c2410c; --plum: #9a2d5e; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Assistant", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .6rem 1.4rem; background: var(--ink); color: #fff; }
header a { color: #fff; text-decoration: none; font-weight: 700; }
.who { font-size: .85rem; opacity: .75; }
main { max-width: 56rem; margin: 0 auto; padding: 2rem 1.2rem 4rem; }
h1 { margin: 0 0 .3rem; font-size: 1.6rem; }
p.lead { margin: 0 0 1.6rem; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: .9rem; }
.card { display: grid; gap: .3rem; padding: 1.1rem 1.2rem; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; color: var(--ink); text-decoration: none; transition: transform .12s, box-shadow .12s, border-color .12s; }
.card:hover { transform: translateY(-2px); border-color: var(--ink); box-shadow: 0 6px 18px rgba(42, 33, 27, .1); }
.card strong { font-size: 1.15rem; }
.card .url { direction: ltr; text-align: start; color: var(--muted); font-size: .85rem; }
.card .go { margin-top: .5rem; color: var(--plum); font-weight: 700; font-size: .9rem; }
.btn { font: inherit; font-weight: 700; min-height: 42px; padding: 0 1.2rem; border: 0; border-radius: 10px; background: var(--ink); color: #fff; cursor: pointer; }
.gate { max-width: 26rem; padding: 1.4rem; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; }
.gate p { margin-top: 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header><a href="./">צ'אט</a><div class="who" id="who"></div></header>
<main>
  <h1>העסקים שלי</h1>
  <p class="lead">כל עסק הוא צ'אט עם כתובת משלו ועמוד עריכה משלו.</p>

  <section class="gate" id="gate">
    <p id="gateMsg">כדי לראות את העסקים צריך להיכנס עם חשבון Google של מנהל.</p>
    <button type="button" class="btn" id="signin">כניסה עם Google</button>
  </section>

  <section class="grid" id="list" hidden></section>
</main>

<script src="/supabase.js"></script>
<script src="/auth.js"></script>
<script>
(function () {
  var SB = window.SUPABASE, AUTH = window.FLOA_AUTH, EP = SB.url + '/functions/v1/chatbot';
  var base = /^chatbot\./.test(location.hostname) ? '/' : '/chatbot/';
  function $(id) { return document.getElementById(id); }
  $('signin').addEventListener('click', function () {
    try { sessionStorage.setItem('chatbot.admin', location.pathname + location.search); } catch (e) {}
    AUTH.signIn(location.origin + location.pathname + location.search);
  });
  if (!AUTH.signedIn()) return;
  $('who').textContent = AUTH.email();
  AUTH.token().then(function (t) {
    return fetch(EP, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB.anonKey, Authorization: 'Bearer ' + t }, body: JSON.stringify({ business: 'harpatka', mode: 'script_admin', action: 'businesses' }) });
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (d) { return { status: r.status, d: d }; });
  }).then(function (x) {
    if (x.status === 401) { $('gateMsg').textContent = 'ההתחברות לא תקפה. נא להיכנס שוב.'; return; }
    if (x.status === 403) { $('gateMsg').textContent = 'לחשבון ' + (x.d.email || AUTH.email()) + ' אין הרשאה. ההרשאה רק למנהלים.'; $('signin').hidden = true; return; }
    var list = x.d.businesses || [];
    if (!list.length) { $('gateMsg').textContent = 'אין עסקים להצגה.'; return; }
    $('gate').hidden = true; $('list').hidden = false;
    list.forEach(function (b) {
      var a = document.createElement('a'); a.className = 'card'; a.href = base + b.key + '/admin';
      var n = document.createElement('strong'); n.textContent = b.title || b.key;
      var u = document.createElement('span'); u.className = 'url'; u.textContent = location.host + (base === '/' ? '/' : base) + b.key;
      var g = document.createElement('span'); g.className = 'go'; g.textContent = 'לעריכה';
      a.appendChild(n); a.appendChild(u); a.appendChild(g); $('list').appendChild(a);
    });
  }).catch(function () { $('gateMsg').textContent = 'שגיאת רשת.'; });
})();
</script>
</body>
</html>
