<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>עריכת הצ'אט</title>
<link rel="stylesheet" href="editor/admin.css?v=19">
</head>
<body>
<header class="top">
  <h1>עריכת הצ'אט <span class="biz" id="bizName"></span></h1>
  <div class="topr"><a class="back" href="admin/">כל העסקים</a><div class="who" id="who"></div></div>
</header>

<main id="app">
  <section id="gate" class="gate">
    <p id="gateMsg">כדי לערוך צריך להיכנס עם חשבון Google של מנהל.</p>
    <button type="button" class="btn" id="signin">כניסה עם Google</button>
  </section>

  <section id="editor" hidden>
    <div class="layout">
    <aside class="side" id="side">
      <button type="button" class="adtoggle" id="adToggle" aria-expanded="false"></button>
      <input class="field" id="adq" type="search" placeholder="חיפוש מודעה לפי קוד או כותרת">
      <div class="count" id="adcount"></div>
      <div class="adlist" id="adlist" role="listbox" aria-label="מודעות"></div>
      <div class="adacts"><button type="button" class="btn ghost" id="newAd">מודעה חדשה</button><button type="button" class="btn ghost" id="delAd">מחק מודעה</button></div>
    </aside>
    <div class="mainc">
    <div class="filters">
      <div class="bar">
        <div class="tools">
          <button type="button" class="btn ghost icon" id="statsBtn" title="סטטיסטיקה: איפה עוזבים, מסלולים ומסעות" aria-label="סטטיסטיקה: איפה עוזבים, מסלולים ומסעות" aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M6 17v-5"/><path d="M11 17V6"/><path d="M16 17v-8"/><path d="M21 17v-3"/></svg></button>
          <button type="button" class="btn ghost icon" id="refreshStats" title="רענן נתונים (לחיצות והצגות מהצ'אט החי)" aria-label="רענן נתונים (לחיצות והצגות מהצ'אט החי)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M20 20v-4h-4"/></svg></button>
          <button type="button" class="btn ghost icon" id="undo" title="בטל צעד אחורה" aria-label="בטל צעד אחורה" disabled><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
          <button type="button" class="btn ghost icon" id="expandAll" title="פתח את כל ההודעות" aria-label="פתח את כל ההודעות"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 8 5 5 5-5"/><path d="m7 14 5 5 5-5"/><path d="M5 4h14"/></svg></button>
          <button type="button" class="btn ghost icon" id="collapseAll" title="סגור את כל ההודעות" aria-label="סגור את כל ההודעות"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 16 5-5 5 5"/><path d="m7 10 5-5 5 5"/><path d="M5 20h14"/></svg></button>
          <button type="button" class="btn ghost icon" id="copyUrl" title="העתק את כתובת המודעה" aria-label="העתק את כתובת המודעה"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg></button>
          <a class="btn ghost icon" id="preview" target="_blank" rel="noopener" title="פתח לבדיקה" aria-label="פתח לבדיקה"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
        </div>
      </div>
      <div class="adset">
        <div><label class="lbl" for="adcode">קוד המודעה בכתובת</label><input class="field" id="adcode" type="text" dir="ltr" maxlength="30"></div>
        <div><label class="lbl" for="adtextin">כותרת המודעה (לעצמנו)</label><input class="field" id="adtextin" type="text"></div>
        <span class="opens" id="opens"></span>
      </div>
    </div>
    <div class="genderbar">
      <div class="seg" id="genders" role="tablist" aria-label="מגדר">
        <button type="button" data-g="female" class="on">אישה</button>
        <button type="button" data-g="male">גבר</button>
        <button type="button" data-g="both">שני המינים</button>
      </div>
    </div>

    <details class="acc" id="general">
      <summary><span class="sum"><span class="t">הגדרות כלליות</span><span class="kind" id="generalSum"></span></span></summary>
      <div class="settings">
        <div>
          <label class="lbl" for="greeting">הברכה הראשונה (בועה נפרדת, משותפת לכל המודעות והמגדרים)</label>
          <p class="hint">הכתובת: ad=קוד המודעה, ובנוסף gender=female או male. בלי gender מוצגת גרסת שני המינים.</p>
          <input class="field" id="greeting" type="text">
        </div>
      </div>
    </details>

    <div class="draftbar" id="draftbar" hidden></div>

    <div id="steps"></div>

    <div class="savebar">
      <input class="field note" id="note" type="text" placeholder="הערה לגרסה (לא חובה)">
      <button type="button" class="btn ghost" id="saveDraft">שמור כטיוטה</button>
      <button type="button" class="btn primary" id="save">שמור גרסה חדשה ופרסם</button>
      <span class="status" id="status" role="status"></span>
    </div>

    <details class="acc">
      <summary><span class="sum"><span class="t">גרסאות</span><span class="kind">שמירה יוצרת גרסה חדשה ומפרסמת מיד. אפשר להחזיר גרסה קודמת</span></span></summary>
      <div class="body" id="versions"></div>
    </details>
    </div>
    </div>
  </section>
</main>

<dialog id="statsDlg" class="panel" aria-labelledby="statsTitle">
  <div class="phead">
    <div class="ptxt"><h2 id="statsTitle">סטטיסטיקה</h2><div class="psub" id="statsSub"></div><div class="psub" id="statsLive" aria-live="off"></div></div>
    <button type="button" class="btn ghost icon" id="statsClose" title="סגור" aria-label="סגור"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg></button>
  </div>
  <div class="pbody" id="statsBody"></div>
</dialog>

<dialog id="dlg" class="dlg"><p id="dlgMsg"></p><button type="button" class="btn primary" id="dlgOk">מחק</button></dialog>

<script src="/supabase.js"></script>
<script src="/auth.js"></script>
<script src="editor/stats.js?v=4"></script>
<script src="editor/admin.js?v=25"></script>
</body>
</html>
