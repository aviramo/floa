<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>בדיקת הצ'אט</title>
<style>
  :root { --cream: #fff4e8; --ink: #2c231d; --paper: #fffdf9; --line: rgba(44,35,29,.28); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); font-family: "Assistant", system-ui, sans-serif; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  h1 { font-size: 1.1rem; margin: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; width: 100%; max-width: 640px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; }
  select, button { font: inherit; font-size: 1rem; min-height: 44px; padding: .4rem .8rem; border: 1.5px solid var(--ink); border-radius: 12px; background: var(--paper); color: var(--ink); cursor: pointer; }
  select { min-width: 12rem; max-width: 100%; }
  button { font-weight: 700; }
  button:active { background: var(--ink); color: var(--paper); }
  .phone { width: min(390px, 100%); height: min(760px, calc(100dvh - 190px)); min-height: 420px; border: 2px solid var(--ink); border-radius: 28px; overflow: hidden; background: var(--cream); box-shadow: 0 6px 0 rgba(44,35,29,.15); }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  .url { font-size: .75rem; opacity: .7; direction: ltr; word-break: break-all; text-align: center; max-width: 640px; }
</style>
</head>
<body>
<h1>בדיקת הצ'אט: בחר כאב ומגדר</h1>
<div class="bar">
  <label>כאב (המודעה)
    <select id="pain">
      <option value="opening_up">רוצה קרבה אבל ברגע האמת משהו בך נסגר?</option>
      <option value="stress_overload">הגוף כבר במיטה והראש עדיין רץ</option>
      <option value="loneliness">איך זה להיות מוקף באנשים ועדיין להרגיש לבד?</option>
      <option value="lost_joy">הכול מסודר בחיים, אז למה שום דבר כבר לא מרגש?</option>
      <option value="low_confidence">הכי כואב להסתכל במראה ולא לאהוב את מי שרואים</option>
    </select>
  </label>
  <label>מגדר
    <select id="gender"><option value="female">אישה</option><option value="male">גבר</option></select>
  </label>
  <button id="restart" type="button">התחל מחדש</button>
</div>
<div class="phone"><iframe id="frame" title="הצ'אט"></iframe></div>
<div class="url" id="url"></div>
<script>
  var pain = document.getElementById('pain'), gender = document.getElementById('gender'), frame = document.getElementById('frame'), url = document.getElementById('url');
  try { var p = new URLSearchParams(location.search); if (p.get('pain')) pain.value = p.get('pain'); if (p.get('gender')) gender.value = p.get('gender'); } catch (e) {}
  function load() {
    var src = '/harpatka?pain=' + encodeURIComponent(pain.value) + '&gender=' + encodeURIComponent(gender.value) + '&fresh=' + Date.now();
    frame.src = src;
    url.textContent = location.origin + '/harpatka?pain=' + pain.value + '&gender=' + gender.value;
  }
  pain.addEventListener('change', load); gender.addEventListener('change', load);
  document.getElementById('restart').addEventListener('click', load);
  load();
</script>
</body>
</html>
