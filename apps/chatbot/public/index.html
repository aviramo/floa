<script>
/* The page is the same for every business: the address says whose bot this is.
   chatbot.floa.co.il/<business>?ad=<code> on the sub-domain, and /chatbot/<business> under floa.co.il or localhost. */
(function () {
  var sub = /^chatbot\./.test(location.hostname), parts = location.pathname.split('/').filter(Boolean);
  var rel = sub ? parts : parts.slice(1);   // under floa.co.il or localhost the first part is /chatbot
  var biz = rel[0] || '';
  var base = sub ? '/' : '/' + (parts[0] || 'chatbot') + '/';
  // back from Google to the root (the address of the page that asked is not among the Redirect URLs): carry the session on to that page
  try { var back = sessionStorage.getItem('chatbot.admin'); if (back !== null && location.hash.indexOf('#access_token') === 0) { sessionStorage.removeItem('chatbot.admin'); location.replace(back + location.hash); return; } } catch (e) {}
  // the home page of the app (/) and the editor of a business (/<business>/admin) are pages of their own, shown in place so the address stays as it is
  var own = !rel.length ? 'home/index.html' : (rel.length === 2 && rel[1] === 'admin' && /^[a-z0-9-]{1,40}$/.test(rel[0]) ? 'editor/index.html' : '');
  if (own) {
    try {
      var x = new XMLHttpRequest(); x.open('GET', base + own, false); x.send();
      if (x.status === 200) { document.documentElement.removeAttribute('class'); document.open(); document.write(x.responseText.replace('<head>', '<head><base href="' + base + '">')); document.close(); window.CHATBOT_PAGE = true; return; }
    } catch (e) {}
  }
  window.CHATBOT = { biz: /^[a-z0-9-]{1,40}$/.test(biz) ? biz : '', base: base };
  document.write('<base href="' + base + '">');
})();
</script>
<link rel="stylesheet" href="assets/chat.css?v=20261124p">
</head>
<body>
<main class="ch-app" id="chatRoot" aria-label="שיחה עם הבוט"></main>
<script src="/supabase.js"></script>
<script src="assets/chat.js?v=20261124q"></script>
<script>
(async function () {
  if (!window.CHATBOT) return;
  var root = document.getElementById('chatRoot'), biz = window.CHATBOT.biz;
  if (!biz) { root.innerHTML = '<p class="ch-note">כתובת לא מוכרת</p>'; return; }
  var cfg = null;
  try { var r = await fetch('businesses/' + biz + '.json', { cache: 'no-cache' }); if (r.ok) cfg = await r.json(); } catch (e) {}
  if (!cfg) { root.innerHTML = '<p class="ch-note">כתובת לא מוכרת</p>'; return; }
  document.title = cfg.title;
  var rb = document.querySelector('meta[name=robots]'); if (rb) rb.content = 'noindex, nofollow';
  var tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.content = cfg.themeColor;
  Object.keys(cfg.theme || {}).forEach(function (k) { document.documentElement.style.setProperty(k, cfg.theme[k]); });
  if (cfg.fonts) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = cfg.fonts; document.head.appendChild(l); }
  if (cfg.pixel) {
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', cfg.pixel); fbq('track', 'PageView');
  }
  root.setAttribute('aria-label', 'שיחה עם ' + cfg.botName);
  FloaChat.init({ root: root, business: biz, cfg: cfg });
})();
</script>
