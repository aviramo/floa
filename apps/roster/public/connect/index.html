<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<!-- No inline script anywhere on this page, so scripts may only come from this site. The page talks to ONE other host, the database.
     Mail previews are frames that inherit this policy (no remote images). A page cannot refuse framing from a meta tag, so connect.js hides itself when framed. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://aexmnaxvahblveejsbup.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>חיבורים</title>
<meta name="description" content="מפתחות API, Webhook ומיילים של העסק">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="">
<link rel="icon" type="image/svg+xml" href="../assets/favicon-connect.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/palette.css?v=dc1774fd">
<link rel="stylesheet" href="../assets/ui.css?v=377ce3e5">
<link rel="stylesheet" href="../assets/field.css?v=aa54ff5f">
<link rel="stylesheet" href="../admin/admin.css?v=3091a8d9">
<link rel="stylesheet" href="../assets/manager.css?v=a1055e15">
<link rel="stylesheet" href="../assets/popup.css?v=cebed68e">
<link rel="stylesheet" href="../assets/sheet.css?v=d424a60c">
<link rel="stylesheet" href="connect.css?v=1079f38e">
</head>
<body>

<!-- Not signed in, no access, no business chosen: the gate (its content is drawn by connect.js) -->
<div class="gate" id="gate" hidden><div class="gate-in" id="gateIn"></div></div>

<!-- Signed in: a POPUP, the participant card's kind (assets/sheet.js builds its shell: grab bar, header with the title and the X). The tabs are the participant card's (.ptabs over the
     side-by-side pages of .ppager); each page scrolls inside itself. Closing it, any way, goes back to the admin page of the business (connect.js). -->
<dialog id="conn" class="connect" data-title="חיבורים" data-from="bottom" data-size="l" aria-labelledby="connT">
  <h2 id="connT" data-rs-title>חיבורים<small class="msub bizname" id="bizName"></small></h2>
  <div class="ptabs" id="tabs" role="tablist" aria-label="חלקי הדף">
    <button type="button" role="tab" id="tab-keys" data-tab="keys" aria-selected="true" aria-controls="pg-keys">מפתחות</button>
    <button type="button" role="tab" id="tab-hook" data-tab="hook" aria-selected="false" aria-controls="pg-hook" tabindex="-1">Webhook</button>
    <button type="button" role="tab" id="tab-mail" data-tab="mail" aria-selected="false" aria-controls="pg-mail" tabindex="-1">מיילים</button>
    <button type="button" role="tab" id="tab-reg" data-tab="reg" aria-selected="false" aria-controls="pg-reg" tabindex="-1">הרשמה</button>
    <button type="button" role="tab" id="tab-log" data-tab="log" aria-selected="false" aria-controls="pg-log" tabindex="-1">יומן</button>
    <span class="ptabi" aria-hidden="true"></span>
  </div>
  <div class="ppager" id="pager">
    <section class="ppage rlist panel" id="pg-keys" role="tabpanel" aria-labelledby="tab-keys" tabindex="0"></section>
    <section class="ppage rlist panel" id="pg-hook" role="tabpanel" aria-labelledby="tab-hook" tabindex="0" inert></section>
    <section class="ppage rlist panel" id="pg-mail" role="tabpanel" aria-labelledby="tab-mail" tabindex="0" inert></section>
    <section class="ppage rlist panel" id="pg-reg" role="tabpanel" aria-labelledby="tab-reg" tabindex="0" inert></section>
    <section class="ppage rlist panel" id="pg-log" role="tabpanel" aria-labelledby="tab-log" tabindex="0" inert></section>
  </div>
</dialog>

<div class="rmenu" id="menu" role="menu" hidden></div>
<dialog id="dlg" aria-labelledby="dlgT" data-from="bottom"></dialog>
<div class="rmsg rmsg--toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/supabase.js?v=1a7d8d1e"></script>
<script src="/auth.js?v=64740567"></script>
<script src="../assets/ui.js?v=6f097c19"></script>
<script src="../assets/undo.js?v=ed21e8f0"></script>
<script src="../assets/field.js?v=3373b0b3"></script>
<script src="../assets/sheet.js?v=56fd9da7"></script>
<script src="../assets/pager.js?v=83aa7c12"></script>
<script src="ai-doc.js?v=e784ad3c"></script>
<script src="mail-defaults.js?v=ac97cc38"></script>
<script src="connect.js?v=c85b7d35"></script>
</body>
</html>
