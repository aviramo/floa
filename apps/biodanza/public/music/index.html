<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ביודנסה: ניהול</title>
<script>document.write('<base href="' + (/^(localhost|127[.]|192[.]168[.]|10[.])/.test(location.hostname) ? '/biodanza/music/' : '/music/') + '">');</script>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/kit.css">
<script>document.write('<link rel="stylesheet" href="' + (/^(localhost|127[.]|192[.]168[.]|10[.])/.test(location.hostname) ? '/biodanza/' : '/') + 'assets/theme.css">')</script>
<style>
/* The page is the window's height and never scrolls: the header and the search stay, only the list scrolls (kit elements only, tokens only). */
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; height: 100dvh; background: var(--page); color: var(--text); font: var(--fw-regular) var(--fs-m)/var(--lh-tight) var(--font); }
#app { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; width: 100%; }
#app > .rlist { flex: 1 1 auto; }
#out, #out * { user-select: text; -webkit-user-select: text; }   /* the text can be selected and copied */
.pad { padding: var(--gap); display: flex; flex-direction: column; gap: var(--gap); }
dialog.rsheet .pad { padding: 0; }   /* a popup pads its content itself (law 2): the block inside it adds nothing */
#out { padding: 0 var(--gap) var(--gap); align-content: start; }   /* the kit's card grid (.rgrid): the cards of a row are one height */
/* the player is the kit's (.rplayer, ui/docs/player.md): its place, height, colours and order are the kit's; the page ends above it (--bar-b) */
</style>
</head>
<body>
<div id="app"></div>
<script src="/supabase.js"></script>
<script src="/auth.js"></script>
<script src="/card.js"></script>
<script src="/search.js"></script>
<script src="/range.js"></script>
<script src="/audio.js"></script>
<script>document.write('<script src="' + (/^(localhost|127[.]|192[.]168[.]|10[.])/.test(location.hostname) ? '/biodanza/' : '/') + 'assets/audio.js"><\/script>')</script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var HOME = /^(localhost|127[.]|192[.]168[.]|10[.])/.test(location.hostname) ? "/biodanza/" : "/";
  var songs = [], byObj = {}, MAXROWS = 300;
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  /* the search is the kit's (/search.js): its matching (no capitals, no marks, every word near a word) and its place in the header */
  var fold = RosterSearch.fold, fzs = RosterSearch.score, curQ = "";
  function nearest(list, text, q) {   /* the matches of a search, nearest first (a plain order when nothing is typed) */
    if (!fold(q).trim()) return list;
    return list.map(function (x, i) { return { x: x, s: fzs(text(x), q), i: i }; }).filter(function (o) { return o.s > 0; })
      .sort(function (a, b) { return b.s - a.s || a.i - b.i; }).map(function (o) { return o.x; });
  }
  function mmss(s) { return s ? Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2) : ""; }
  function clk(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }   /* the player's times: 0:00 is shown, not left empty */
  /* the icons are the kit's sprite (/icons.svg, ui/docs/icon.md), never a drawing of the page's own */
  function sym(n) { return '<svg class="rsym" aria-hidden="true" focusable="false"><use href="/icons.svg#' + n + '"/></svg>'; }
  /* the kit's empty state with the icon of its subject (the note: this page is music); the kit centres it in its area */
  var NOTE = sym("music");
  function empty(title, text, btn) { return '<div class="rlayout rempty">' + NOTE + '<b>' + esc(title) + '</b>' + (text ? '<span>' + esc(text) + '</span>' : '') + (btn || "") + '</div>'; }
  function msg(title, text, btn) { app.innerHTML = empty(title, text, btn); }
  /* a load that failed: ONE action, "ניסיון נוסף", that asks again without reloading the page */
  document.addEventListener("click", function (e) { if (e.target.closest && e.target.closest("[data-retry]")) { app.innerHTML = ""; start(); } });
  function shell() {
    app.innerHTML = '<header class="rhead"><div class="rhead__text"><span class="rhead__tw"><h1 class="rhead__title" title="המוזיקה">המוזיקה</h1></span></div><span class="rhead__acts"><button type="button" class="rbtn rbtn--icon" id="cp" aria-label="העתקת הרשימה המוצגת" title="העתקת הרשימה המוצגת">' + ICO.copy + '</button><button type="button" class="rbtn rbtn--icon" id="qs" aria-label="חיפוש" title="חיפוש">' + ICO.search + '</button></span></header>' +   /* the search is in the header, from the magnifier (the kit's), last at the far end (owner 2026-11-25) */
      '<div class="rlist rlayout rlayout--grid rgrid" id="out" data-load="music"></div>' +
      playerHtml();   /* the kit's player, fixed at the bottom: only the list scrolls */
    RosterSearch.attach(app.querySelector("#qs"), app.querySelector("#out"), { label: "חיפוש שיר או מבצע", key: "biodanza.music", heavy: true, icon: NOTE,   /* a long list: it waits --search-wait for a pause in the typing */
      onQuery: function (q) { curQ = q; if (songs.length) draw(); } });
    app.querySelector("#cp").addEventListener("click", copyAll);
  }
  function found() {
    var words = fold(curQ).split(/\s+/).filter(Boolean);
    return { words: words, hit: nearest(songs, function (m) { return m.f; }, words.join(" ")) };
  }
  /* every song that matches the search (not only the rows drawn), one per line: name, performer, length, code, file */
  function copyAll() {
    var b = document.getElementById("cp"), txt = found().hit.map(function (m) { return [m.title || m.name, m.artist, mmss(len(m)), m.audio_object ? "יש קובץ" : "ללא קובץ"].join(String.fromCharCode(9)); }).join(String.fromCharCode(10));
    function done(ok) { b.innerHTML = ok ? ICO.done : ICO.copy; b.title = ok ? "הועתק" : "ההעתקה נחסמה, אפשר לסמן ולהעתיק ידנית"; setTimeout(function () { b.innerHTML = ICO.copy; b.title = "העתקת הרשימה המוצגת"; }, 2000); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { done(true); }, function () { done(false); }); else done(false);
  }
  var CHUNK = 90, hitList = [], shown = 0;
  function len(m) { return m.file_sec ? Math.round(m.file_sec) : m.duration_sec; }   /* the real length of the file, the catalog's when there is no file */
  function card(m) {
    var has = m.audio_object && window.BioAudio;
    if (has) BioAudio.info(m.audio_object, m.title || m.name, m.artist);
    return RosterCard.html({ click: true, attrs: 'data-mid="' + esc(m.id) + '" data-rsearch-item', title: m.title || m.name, sub: m.artist || "", num: len(m) ? mmss(len(m)) : "",   /* the kit's card (ui/card.js): name, performer, length, and the play or upload button at the end of the second row */
      act2: has ? '<button type="button" class="rbtn rbtn--icon" data-audio="' + esc(m.audio_object) + '" aria-label="השמעה" title="השמעה"></button>' : '<button type="button" class="rbtn rbtn--text" data-up="' + esc(m.id) + '" title="העלאת קובץ לשיר, זמין לכולם">העלאה</button>' });
  }
  /* a song with no file: choosing one here puts it in the bucket (through the Worker), attaches it to the song, and the song plays for everybody */
  var UPL = { mp3: 1, flac: 1, wav: 1, aiff: 1, aif: 1, m4a: 1 };
  document.addEventListener("click", function (e) { var b = e.target.closest && e.target.closest("[data-up]"); if (b) upload(b); });
  function upload(b) {
    if (b.dataset.busy) return;
    var id = b.dataset.up, m = songs.filter(function (x) { return x.id === id; })[0]; if (!m) return;
    var inp = document.createElement("input"); inp.type = "file"; inp.accept = "audio/*,.flac,.m4a,.aiff,.aif,.wav,.mp3";
    var label = b.textContent, say = function (t, ms) { b.textContent = t; if (ms) setTimeout(function () { b.textContent = label; delete b.dataset.busy; }, ms); };
    inp.addEventListener("change", function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var fmt = (f.name.split(".").pop() || "").toLowerCase(); if (!UPL[fmt]) return say("קובץ שמע בלבד", 2500);
      b.dataset.busy = "1"; say("0%");
      FLOA_AUTH.token().then(function (t) {
        return new Promise(function (res, rej) {
          var x = new XMLHttpRequest(); x.open("PUT", "https://api.floa.co.il/biodanza/audio/upload");
          x.setRequestHeader("authorization", "Bearer " + t); x.setRequestHeader("x-format", fmt);
          x.upload.onprogress = function (ev) { if (ev.lengthComputable) say(Math.round(ev.loaded / ev.total * 100) + "%"); };
          x.onload = function () { if (x.status === 200) { try { res(JSON.parse(x.responseText)); } catch (er) { rej(er); } } else rej(new Error("upload " + x.status)); };
          x.onerror = function () { rej(new Error("upload")); };
          x.send(f);
        });
      }).then(function (o) {
        return FLOA_AUTH.api("/rest/v1/rpc/attach_audio", { method: "POST", json: { p_music: id, p_object: o.object, p_format: o.format, p_size: o.size } }).then(function () { return o; });
      }).then(function (o) {
        m.audio_object = o.object; byObj[o.object] = m;
        if (window.BioAudio) { BioAudio.info(o.object, m.title || m.name, m.artist); b.outerHTML = '<button type="button" class="rbtn rbtn--icon" data-audio="' + esc(o.object) + '" aria-label="השמעה" title="השמעה"></button>'; }
        else say("נשמר", 0);
      }).catch(function (er) { console.error(er); say("ההעלאה נכשלה", 3000); });
    });
    inp.click();
  }
  /* the whole card is the button (the kit's card binding: its own button does its own thing): a song with a file plays (or pauses), a song with none asks for its file; text being selected is left alone */
  RosterCard.bind(document, "[data-mid]", function (c) {
    var sel = window.getSelection && String(window.getSelection()); if (sel) return;
    var a = c.querySelector("[data-audio]"), u = c.querySelector("[data-up]");
    if (a && window.BioAudio && BioAudio.tap) BioAudio.tap(a.dataset.audio); else if (u) upload(u);
  });
  function more() {   /* the next cards, when the list is scrolled near its end: the page draws a few dozen at a time, never all three thousand */
    var out = document.getElementById("out"); if (!out || shown >= hitList.length) return;
    out.insertAdjacentHTML("beforeend", hitList.slice(shown, shown + CHUNK).map(card).join("")); shown = Math.min(hitList.length, shown + CHUNK);
  }
  function draw() {
    var f = found(), words = f.words, out = document.getElementById("out");
    hitList = f.hit; shown = 0; out.scrollTop = 0;
    if (!hitList.length) { out.innerHTML = words.length ? "" : empty("אין מוסיקה", ""); return; }   /* nothing found by a search: the kit's "לא נמצא"; with no search the list itself is empty */
    out.innerHTML = ""; more();
    if (!out.dataset.scr) { out.dataset.scr = "1"; out.addEventListener("scroll", function () { if (out.scrollTop + out.clientHeight > out.scrollHeight - 600) more(); }, { passive: true }); }
  }
  function page(n) { return FLOA_AUTH.api("/rest/v1/music?select=id,name,title,artist,duration_sec,file_sec,collection,audio_object&order=name,id&limit=1000&offset=" + n * 1000); }
  function load() {   /* three pages at once, and a fourth only if the third was full */
    return Promise.all([page(0), page(1), page(2)]).then(function (r) {
      var all = r[0].concat(r[1], r[2]);
      return r[2].length === 1000 ? page(3).then(function (x) { return all.concat(x); }) : all;
    });
  }
  /* ONE player, fixed above the search: play or pause, a bar to any place in the song, the place and the length in time, the song's name and performer.
     The song's buttons in the rows start it; audio.js tells this page (event "bioaudio") what plays and where it is. */
  var cur = { name: "", t: 0, d: 0, playing: false };
  var ICO = { search: sym("search"), copy: sym("copy"), done: sym("check"), play: sym("play"), pause: sym("pause") };   /* play and pause: line drawings, also in the large icon (owner 2026-11-26) */
  function playerHtml() {
    return '<section class="rplayer" id="pl" data-state="idle" aria-label="נגן"><span class="rplayer__time" id="pc" dir="ltr">0:00 / 0:00</span>' +
      '<button type="button" class="ricon-lg" id="pp" aria-label="השמעה" title="השמעה">' + ICO.play + '</button>' +
      '<input type="range" class="rrange rrange--seek" id="pb" min="0" max="0" value="0" step="1" aria-label="מקום בשיר" disabled>' +   /* the kit's seek bar: its value in seconds */
      '<div class="rplayer__info" id="pn"><span class="rplayer__title" id="pt" dir="auto" aria-live="polite"></span><span class="rplayer__sub" id="pa" dir="auto"></span></div>' +
      '<span class="rplayer__none">לא נבחרה מוסיקה</span></section>';   /* the kit's slots (ui/docs/player.md): no menu here, so what plays is plain text, not a button */
  }
  function paintPlayer() {
    var pp = document.getElementById("pp"), pb = document.getElementById("pb"); if (!pp) return;
    var m = byObj[cur.name], on = !!cur.name;
    var t1 = on ? (m ? (m.title || m.name) : "מוסיקה") : "", t2 = on && m ? (m.artist || "") : "";
    if (document.getElementById("pt").textContent !== t1) document.getElementById("pt").textContent = t1;
    document.getElementById("pa").textContent = t2;
    document.getElementById("pl").dataset.state = !on ? "idle" : cur.playing ? "playing" : "paused";   /* the kit shows and hides the slots by the state */
    pb.disabled = !on || !(cur.d > 0);
    var lab = cur.playing ? "עצירה" : "השמעה"; if (pp.getAttribute("aria-label") !== lab) { pp.innerHTML = cur.playing ? ICO.pause : ICO.play; pp.setAttribute("aria-label", lab); pp.title = lab; }
    if (RosterRange.held(pb)) return;   /* the bar is held: the thumb and the time follow the finger, not the playback, until it is let go */
    document.getElementById("pc").textContent = clk(cur.t) + " / " + clk(cur.d);
    var mx = String(cur.d > 0 ? Math.round(cur.d) : 0); if (pb.max !== mx) pb.max = mx;
    RosterRange.set(pb, cur.d > 0 ? Math.floor(cur.t) : 0);
  }
  document.addEventListener("bioaudio", function (ev) { var d = ev.detail || {}; cur = { name: d.name || "", t: d.t || 0, d: d.d || 0, playing: !!d.playing }; paintPlayer(); });
  document.addEventListener("click", function (e) { if (e.target.closest && e.target.closest("#pp") && window.BioAudio) BioAudio.playPause(); });
  /* the keyboard, as in the app: right and left move the song 5 seconds (Shift 15), up and down are the volume (Shift for five steps), wherever the focus is, a focused bar too (its own step is prevented: one move per press); in a text field they move the caret */
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || !window.BioAudio) return;
    var k = e.key, tg = e.target;
    if (k !== "ArrowRight" && k !== "ArrowLeft" && k !== "ArrowUp" && k !== "ArrowDown") return;
    if (tg && (tg.isContentEditable || /^(TEXTAREA|SELECT)$/.test(tg.tagName) || (tg.tagName === "INPUT" && tg.type !== "range"))) return;
    e.preventDefault();
    if (k === "ArrowRight" || k === "ArrowLeft") BioAudio.skip((k === "ArrowRight" ? 1 : -1) * (e.shiftKey ? 15 : 5));
    else BioAudio.volume((k === "ArrowUp" ? 1 : -1) * (e.shiftKey ? 0.05 : 0.01));
  });
  /* the bar (the kit's slider): while it is dragged the time follows the thumb (the kit paints the fill); the song moves when it is let go */
  document.addEventListener("input", function (e) { if (e.target.id === "pb") document.getElementById("pc").textContent = clk(+e.target.value) + " / " + clk(cur.d); });
  document.addEventListener("change", function (e) {
    var pb = e.target; if (pb.id !== "pb" || !window.BioAudio || !(+pb.max > 0)) return;
    BioAudio.seek(pb.value / pb.max); if (BioAudio.commitSeek) BioAudio.commitSeek();
  });
  function start() {
    if (!window.FLOA_AUTH || !FLOA_AUTH.signedIn()) return msg("ניהול", "צריך להיכנס קודם דרך האפליקציה.", '<a class="rbtn" href="' + HOME + '">לאפליקציה</a>');
    var songsAsk = load();   /* started now, not after the permission answer: the two travel together */
    songsAsk.catch(function () { /* handled below */ });
    FLOA_AUTH.api("/rest/v1/rpc/me", { method: "POST", json: {} }).then(function (me) {
      if (!me || !me.admin) return msg("ניהול", "הדף הזה למנהלים בלבד.");
      shell();
      var o0 = document.getElementById("out"); o0.innerHTML = ""; o0.classList.add("rload", "raccent-2"); o0.setAttribute("aria-busy", "true");   /* the kit's loading state: the list's area, empty, until the songs are here; a note (data-load) in the music colour (.raccent-2) */
      return songsAsk.then(function (rows) {
        o0.classList.remove("rload", "raccent-2"); o0.removeAttribute("aria-busy");
        songs = rows.map(function (m) { m.f = fold([m.name, m.title, m.artist, m.collection].join(" ")); return m; });
        byObj = {}; songs.forEach(function (m) { if (m.audio_object) byObj[m.audio_object] = m; });
        draw();
      });
    }).catch(function () { msg("לא הצלחנו לטעון", "בדקו את החיבור ונסו שוב.", '<button type="button" class="rbtn" data-retry>ניסיון נוסף</button>'); });
  }
  start();
})();
</script>
</body>
</html>
