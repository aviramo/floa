<style>
/* The page shell: a column the height of the window, so the page never scrolls and only .rlist does. On a wide screen the list of
   vivencias is the right pane and the open vivencia the left one, with a line between them that can be dragged (roster's split).
   Tokens only. Awaiting the owner's approval as part of the kit. */
html, body { height: 100%; }   /* the page itself never scrolls (the shell is exactly the window's height): only .rlist and a popup's body do. No overflow:hidden on the root: it switches off the browser's own pull-down to refresh. */
body { margin: 0; display: flex; flex-direction: column; height: 100dvh; background: var(--page); color: var(--text); font: var(--fw-regular) var(--fs-m)/var(--lh-tight) var(--font); }
#app { position: relative; display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
#pl, #pd { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; min-width: 0; }
#pl > .rlist, #pd > .rlist { flex: 1 1 auto; }
#pd, #sh { display: none; }
.pad { padding: var(--gap); display: flex; flex-direction: column; gap: var(--gap); }
dialog.rsheet .pad { padding: 0; }   /* a popup pads its content itself (law 2): the block inside it adds nothing */
.bar { display: flex; flex-direction: column; gap: var(--gap); padding: var(--gap) var(--gap) var(--end-pad); border-top: 1px solid var(--border); }
@media (min-width: 760px) {
  :root { --listw: 50vw; }
  #app { display: grid; grid-template-columns: var(--listw) 1fr; }
  #pl { border-inline-end: 1px solid var(--border); }
  #pl .rfab { left: calc(100vw - var(--listw) + var(--gap)); }   /* the add button keeps the same gap to the pane's side and bottom edges as to the window's */
  #pd { display: flex; }
  #sh { display: block; position: absolute; top: 0; bottom: 0; right: calc(var(--listw) - var(--gap-tight)); z-index: var(--z-menu); width: var(--handle-w); cursor: col-resize; touch-action: none; }
  #sh::after { content: ""; position: absolute; top: 0; bottom: 0; right: var(--gap-tight); width: calc(var(--bw) * 2); background: transparent; transition: background var(--t-base); }
  #sh:hover::after, #sh:focus-visible::after, html.split-drag #sh::after { background: var(--border-strong); }
  #sh:focus-visible { outline: none; }
  html.split-drag, html.split-drag * { cursor: col-resize !important; user-select: none !important; }
}
</style>

<script>
/* The app opens with no internet: a worker keeps the shell (sw.js, at the host's root on biodanza.floa.co.il, under /biodanza/ on localhost). */
if ("serviceWorker" in navigator) window.addEventListener("load", function () {
  navigator.serviceWorker.register((/^(localhost|127[.])/.test(location.hostname) ? "/biodanza/" : "/") + "sw.js").catch(function () { /* no offline shell this time */ });
