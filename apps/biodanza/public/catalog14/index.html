<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ביודנסה: קטלוג 2014</title>
<script>document.write('<base href="' + (/^(localhost|127[.]|192[.]168[.]|10[.])/.test(location.hostname) ? '/biodanza/catalog14/' : '/catalog14/') + '">');</script>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/kit.css">
<script>document.write('<link rel="stylesheet" href="' + (/^(localhost|127[.]|192[.]168[.]|10[.])/.test(location.hostname) ? '/biodanza/' : '/') + 'assets/theme.css">')</script>
<style>
/* The page is the window's height and never scrolls: the header, the search and the filter stay, only the list scrolls (kit elements only, tokens only). */
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; height: 100dvh; background: var(--page); color: var(--text); font: var(--fw-regular) var(--fs-m)/var(--lh-tight) var(--font); }
#app { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; width: 100%; }
#app > .rlist { flex: 1 1 auto; }
#out, #out * { user-select: text; -webkit-user-select: text; }
.pad { padding: var(--gap); display: flex; flex-direction: column; gap: var(--gap); }
.pad > .rfield { max-width: var(--w); }   /* the filter is as wide as a short window at most (--w), never a raw width */
#out { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 24rem), 1fr)); gap: var(--gap); padding: 0 var(--gap) var(--gap); align-content: start; align-items: stretch; }
#out > .rcard { background: var(--on-primary); margin: 0; min-width: 0; display: flex; flex-direction: column; align-items: stretch; gap: var(--gap); }   /* NOT yet the kit's card: a comparison sheet of several blocks does not fit the card's two rows; waits for the owner's decision on how it looks as a card */
#out > * { flex-shrink: 0; }
.c__t, .c__s, .c__h { overflow-wrap: anywhere; }
.c__t { direction: ltr; text-align: start; font: var(--fw-bold) var(--fs-m)/var(--lh-tight) var(--font); }
.c__h { font: var(--fw-regular) var(--fs-m)/var(--lh-tight) var(--font); color: var(--text-muted); }
.c__s { color: var(--text-muted); font: var(--fw-regular) var(--fs-s)/var(--lh-tight) var(--font); }
.c__blk { display: flex; flex-direction: column; gap: 2px; }
.c__match { display: flex; flex-direction: column; gap: 2px; }
.c__lbl { color: var(--text-muted); font: var(--fw-regular) var(--fs-s)/1 var(--font); margin-bottom: 2px; }
.c__why { color: var(--text); font: var(--fw-regular) var(--fs-s)/var(--lh-tight) var(--font); margin-top: var(--gap); }
.c__accs { display: flex; flex-direction: column; }
.c__accb { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: var(--gap); padding-block: var(--gap); cursor: pointer; font: var(--fw-regular) var(--fs-m)/var(--lh-tight) var(--font); color: var(--text); }
.c__accb:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.c__plays { display: flex; flex-wrap: wrap; gap: var(--gap); padding-bottom: var(--gap); }
.c__names { display: flex; flex-direction: column; gap: 2px; padding-bottom: var(--gap); direction: ltr; text-align: start; }
.c__more { display: flex; flex-direction: column; gap: 2px; }
.rhead.rhead { border-bottom: 0; position: relative; z-index: 2 }
.rhead.rhead::after { content: ""; position: absolute; inset-inline: 0; top: 100%; height: var(--gap); background: var(--edge-shadow); opacity: 0; transition: opacity .18s ease; pointer-events: none }
.rhead.rhead[data-scrolled]::after { opacity: 1 }
@media (prefers-reduced-motion: reduce) { .rhead.rhead::after { transition: none } }
</style>
<script>
/* the standard soft edge under the header while the list is scrolled (same as the app's pages and popups) */
document.addEventListener("scroll", function (e) {
  var el = e.target; if (!el || el.nodeType !== 1) return;
  var h = el.parentElement && el.parentElement.querySelector(":scope > .rhead"); if (!h) return;
  if (el.scrollTop > 2) h.setAttribute("data-scrolled", ""); else h.removeAttribute("data-scrolled");
}, { capture: true, passive: true });
</script>
</head>
<body>
<div id="app"></div>
<script src="/supabase.js"></script>
<script src="/auth.js"></script>
<script src="/search.js"></script>
<script src="/layout.js"></script>
<script src="/menu.js"></script>
<script src="/field.js"></script>
<script src="/audio.js"></script>
<script>document.write('<script src="' + (/^(localhost|127[.]|192[.]168[.]|10[.])/.test(location.hostname) ? '/biodanza/' : '/') + 'assets/audio.js"><\/script>')</script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var HOME = /^(localhost|127[.]|192[.]168[.]|10[.])/.test(location.hostname) ? "/biodanza/" : "/";
  var rows = [];
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  /* the search is the kit's (/search.js): its matching (no capitals, no marks, every word near a word) and its place in the header */
  var fold = RosterSearch.fold, fzs = RosterSearch.score, curQ = "";
  function nearest(list, text, q) {   /* the matches of a search, nearest first (a plain order when nothing is typed) */
    if (!fold(q).trim()) return list;
    return list.map(function (x, i) { return { x: x, s: fzs(text(x), q), i: i }; }).filter(function (o) { return o.s > 0; })
      .sort(function (a, b) { return b.s - a.s || a.i - b.i; }).map(function (o) { return o.x; });
  }
  var STR = { exact: "זהה", strong: "חזקה", possible: "אפשרית" };
  /* the icons are the kit's sprite (/icons.svg, ui/docs/icon.md), never a drawing of the page's own */
  function sym(n, dir) { return '<svg class="rsym' + (dir ? " rsym--dir" : "") + '" aria-hidden="true" focusable="false"><use href="/icons.svg#' + n + '"/></svg>'; }
  /* the kit's empty state with the icon of its subject: this page is exercises (the standing person); the kit centres it in its area */
  var EXERCISE = sym("exercise");
  function empty(title, text, btn, icon) { return '<div class="rlayout rempty">' + (icon || EXERCISE) + '<b>' + esc(title) + '</b>' + (text ? '<span>' + esc(text) + '</span>' : '') + (btn || "") + '</div>'; }
  function msg(title, text, btn) { app.innerHTML = empty(title, text, btn); }
  /* a load that failed: ONE action, "ניסיון נוסף", that asks again without reloading the page */
  document.addEventListener("click", function (e) { if (e.target.closest && e.target.closest("[data-retry]")) { app.innerHTML = ""; start(); } });
  function shell() {
    app.innerHTML = '<header class="rhead"><a class="rbtn rbtn--icon rbtn--edge-start" href="' + HOME + '" aria-label="חזרה לאפליקציה" title="חזרה לאפליקציה" style="text-decoration:none">' + sym("back", 1) + '</a><div class="rhead__text"><span class="rhead__tw"><h1 class="rhead__title" title="קטלוג 2014 מול הקטלוג">קטלוג 2014 מול הקטלוג</h1></span></div><span class="rhead__acts"><button type="button" class="rbtn rbtn--icon" id="qs" aria-label="חיפוש" title="חיפוש">' + sym("search") + '</button></span></header>' +   /* the search is in the header, from the magnifier (the kit's) */
      '<div class="pad">' +
      '<label class="rlayout rlayout--unit rfield"><span>הצגה</span><select id="f"><option value="all">הכול</option><option value="match">יש התאמה</option><option value="good">התאמה זהה או חזקה</option><option value="possible">התאמה אפשרית</option><option value="none">אין התאמה</option><option value="music">יש מוסיקה</option><option value="split">תרגיל קיים עם כמה מ־2014</option></select></label></div>' +
      '<div class="rlist" id="out" data-load="exercise"></div>';
    RosterSearch.attach(app.querySelector("#qs"), app.querySelector("#out"), { label: "חיפוש תרגיל", key: "biodanza.c14", heavy: true, icon: EXERCISE,   /* a long list of big cards: it waits --search-wait for a pause in the typing */
      onQuery: function (q) { curQ = q; if (rows.length) draw(); } });
    app.querySelector("#f").addEventListener("change", draw);
    app.querySelector("#out").addEventListener("click", function (e) { var x = e.target.closest("[data-acc]"); if (x) { opened[x.dataset.acc] = !opened[x.dataset.acc]; draw(); } });
  }
  function best(r) { var m = r.matches[0]; return m && m.strength !== "candidate" && m.strength !== "none" ? m : null; }
  function pass(r, f) {
    var b = best(r);
    return f === "all" || (f === "match" && b) || (f === "good" && b && (b.strength === "exact" || b.strength === "strong")) || (f === "possible" && b && b.strength === "possible") || (f === "none" && !b) || (f === "music" && r.music.length);
  }
  function pct(x) { return Math.round(x * 100) + "%"; }
  function nm(e) { return '<div class="c__t">' + esc(e.title_en) + '</div><div class="c__h">' + esc(e.title_he) + '</div>'; }
  function why(r, m) {
    var t = m.title >= 0.95 ? "השם זהה" : m.title >= 0.75 ? "השם דומה מאוד (" + pct(m.title) + ")" : "השם דומה בחלקו (" + pct(m.title) + ")";
    var h = '<div class="c__why">' + t;
    h += '</div><div class="c__why"><b>מוסיקה</b><br>בתרגיל מ־2014: ' + r.music.length + ' מוסיקות<br>בתרגיל הקיים: ' + m.songs_n + ' מוסיקות<br>משותפים: ' + m.shared + (m.shared ? ' (התאמה ' + pct(m.jaccard) + ')' : '') + '</div>';
    return h;
  }
  var opened = {};
  var CHEV = sym("expand");
  function acc(key, label, objs, names) {
    var on = !!opened[key], total = objs.length + names.length;
    var h = '<div class="c__acc"><button type="button" class="c__accb" data-acc="' + key + '" aria-expanded="' + on + '"><span>' + label + ' · ' + total + ' מוזיקות</span><span style="flex:none;display:flex;transition:transform .2s;' + (on ? 'transform:rotate(180deg)' : '') + '">' + CHEV + '</span></button>';
    if (on) {
      h += '<div class="c__plays">' + objs.map(function (o) { return window.BioAudio ? BioAudio.button(o) : ''; }).join("") + '</div>';
      if (names.length) h += '<div class="c__s c__names"><span class="c__lbl">אין קובץ</span>' + names.map(function (n) { return '<span>' + esc(n) + '</span>'; }).join("") + '</div>';
      if (!total) h += '<span class="c__s">אין מוזיקות</span>';
    }
    return h + '</div>';
  }
  var SEP = '<div class="rlayout rlayout--unit rdiv rdiv--line" aria-hidden="true"></div>';   /* the kit's divider, line only: between the blocks of a card (the card's gap above and below it) */
  function card(r) {
    var b = best(r), m0 = r.matches[0];
    var h = '<div class="rcard" data-rsearch-item><div class="c__blk"><span class="c__lbl">מקטלוג 2014</span>' + nm(r) + '<span class="c__s" style="margin-top:4px">קטגוריה לפי Brush: ' + (r.category_brush ? esc(r.category_brush) : 'אין') + '</span>' + (r.handled ? '<span class="c__s" style="margin-top:4px">' + (r.handled === 'done' ? 'טופל' : 'טופל חלקית') + '</span>' : '') + '</div>';
    if (b) {
      h += SEP + '<div class="c__match"><span class="c__lbl">התאמה בקטלוג הקיים: ' + STR[b.strength] + '</span>' + nm(b) + why(r, b) + '</div>';
    } else {
      h += SEP + '<div class="c__match"><span class="c__lbl">אין התאמה בקטלוג הקיים</span>' + (m0 ? '<span class="c__s">הדומה ביותר: ' + esc(m0.title_en) + ' (' + pct(m0.title) + ')</span>' : '') + '</div>';
    }
    var more = r.matches.slice(b ? 1 : 1).filter(function (m) { return m.strength === "candidate"; });
    if (more.length) h += SEP + '<div class="c__more"><span class="c__lbl">מועמדים נוספים</span>' + more.map(function (m) { return '<span class="c__s">' + esc(m.title_en) + ' (' + pct(m.title) + (m.shared ? ', מוסיקה ' + pct(m.jaccard) : '') + ')</span>'; }).join("") + '</div>';
    var byId = {}; r.music.forEach(function (m) { byId[m.id] = m; });
    var o14 = [], n14 = [];
    (r.pdf || []).forEach(function (x) { var m = x.m && byId[x.m]; if (m && m.object) o14.push(m.object); else n14.push(x.n); });
    h += SEP + '<div class="c__accs">' + acc("14-" + r.id, "2014", o14, n14) + (b ? acc("12-" + r.id, "2012", b.objs || [], b.nofile || []) : '') + '</div>';
    return h + '</div>';
  }
  function groups() {
    var g = {}, out = [];
    rows.forEach(function (r) { var b = best(r); if (b) (g[b.id] = g[b.id] || { ex: b, items: [] }).items.push({ r: r, b: b }); });
    Object.keys(g).forEach(function (k) { if (g[k].items.length > 1) { g[k].f = fold(g[k].ex.title_en + " " + g[k].ex.title_he + " " + g[k].items.map(function (i) { return i.r.title_en + " " + i.r.title_he; }).join(" ")); out.push(g[k]); } });
    return out.sort(function (x, y) { return y.items.length - x.items.length; });
  }
  function gcard(g) {
    var h = '<div class="rcard" data-rsearch-item><div class="c__blk"><span class="c__lbl">תרגיל בקטלוג הקיים · ' + g.items.length + ' תרגילים מ־2014</span>' + nm(g.ex) + '</div>' + SEP + '<div class="c__match"><span class="c__lbl">מקטלוג 2014</span>';
    g.items.sort(function (x, y) { return y.b.title - x.b.title; }).forEach(function (i) {
      h += '<div class="c__blk" style="margin-bottom:var(--gap)"><div class="c__t">' + esc(i.r.title_en) + '</div><div class="c__h">' + esc(i.r.title_he) + '</div><div class="c__s">שם ' + pct(i.b.title) + ' · מוסיקה: ' + i.r.music.length + ' מוסיקות, ' + i.b.shared + ' משותפים' + (i.b.shared ? ' (' + pct(i.b.jaccard) + ')' : '') + '</div></div>';
    });
    return h + '</div></div>';
  }
  function draw() {
    var out = document.getElementById("out"), q = curQ, f = document.getElementById("f").value;
    var split = f === "split", all = split ? groups() : rows;
    var list = nearest(split ? all : rows.filter(function (r) { return pass(r, f); }), function (r) { return r.f; }, q);
    out.innerHTML = list.length ? list.map(split ? gcard : card).join("") : q ? "" : empty("אין תרגילים", "", "", EXERCISE);   /* nothing found by a search: the kit's "לא נמצא"; with no search the list itself is empty */
  }
  function start() {
    if (!window.FLOA_AUTH || !FLOA_AUTH.signedIn()) return msg("קטלוג 2014", "צריך להיכנס קודם דרך האפליקציה.", '<a class="rbtn" href="' + HOME + '">לאפליקציה</a>');
    FLOA_AUTH.api("/rest/v1/rpc/me", { method: "POST", json: {} }).then(function (me) {
      if (!me || !me.admin) return msg("קטלוג 2014", "הדף הזה למנהלים בלבד.");
      shell();
      var o0 = document.getElementById("out"); o0.innerHTML = ""; o0.classList.add("rload"); o0.setAttribute("aria-busy", "true");   /* the kit's loading state: the list's area, empty, until the exercises are here */
      return FLOA_AUTH.api("/rest/v1/rpc/c14_list", { method: "POST", json: {} }).then(function (r) {
        o0.classList.remove("rload"); o0.removeAttribute("aria-busy");
        rows = (r || []).map(function (x) { x.f = fold([x.title_en, x.title_he, x.category, x.music.map(function (m) { return m.name; }).join(" ")].join(" ")); return x; });
        Array.prototype.forEach.call(document.querySelectorAll("#f option"), function (o) { o.textContent += " (" + (o.value === "split" ? groups().length : rows.filter(function (r) { return pass(r, o.value); }).length) + ")"; });
        draw();
      });
    }).catch(function () { msg("לא הצלחנו לטעון", "בדקו את החיבור ונסו שוב.", '<button type="button" class="rbtn" data-retry>ניסיון נוסף</button>'); });
  }
  start();
})();
</script>
</body>
</html>
