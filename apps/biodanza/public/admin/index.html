<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ביודנסה: ניהול</title>
<script>document.write('<base href="' + (/^(localhost|127[.])/.test(location.hostname) ? '/biodanza/admin/' : '/admin/') + '">');</script>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/kit.css">
<style>
/* The page is the window's height and never scrolls: the header and the search stay, only the list scrolls (kit elements only, tokens only). */
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; height: 100dvh; background: var(--bg); color: var(--text); font: var(--fw-regular) var(--fs-m)/var(--lh-body) var(--font); }
#app { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; max-width: 56rem; width: 100%; margin-inline: auto; }
#app > .rlist { flex: 1 1 auto; }
#out, #out * { user-select: text; -webkit-user-select: text; }   /* the text can be selected and copied */
.pad { padding: var(--gutter); display: flex; flex-direction: column; gap: var(--gap-field); }
#out > * { flex-shrink: 0; }   /* the list is a column that scrolls: its rows keep their height (a row with a bar was squeezed to the minimum and the bar cut off) */
/* the song's bar, as in the app: a thin track filled up to the place, a round thumb, red on hover */
.bio-bar input { -webkit-appearance: none; appearance: none; background: transparent; height: 20px; margin: 0; cursor: pointer; --p: 0%; --c: var(--primary); touch-action: none }
.bio-bar input:hover { --c: var(--danger) }
.bio-bar input::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--c) var(--p), var(--surface-2) var(--p)) }
.bio-bar input::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border: 0; border-radius: 50%; background: var(--c) }
.bio-bar input::-moz-range-track { height: 4px; border-radius: 2px; background: var(--surface-2) }
.bio-bar input::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--c) }
.bio-bar input::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--c) }
.bio-bar input:focus, .bio-bar input:focus-visible { outline: none }
</style>
</head>
<body>
<div id="app"></div>
<script src="/supabase.js"></script>
<script src="/auth.js"></script>
<script>document.write('<script src="' + (/^(localhost|127[.])/.test(location.hostname) ? '/biodanza/' : '/') + 'assets/audio.js"><\/script>')</script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var HOME = /^(localhost|127[.])/.test(location.hostname) ? "/biodanza/" : "/";
  var songs = [], byObj = {}, timer = 0, MAXROWS = 300;
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fold(t) { return String(t == null ? "" : t).normalize("NFD").replace(new RegExp("[" + String.fromCharCode(0x300) + "-" + String.fromCharCode(0x36f) + String.fromCharCode(0x591) + "-" + String.fromCharCode(0x5c7) + "]", "g"), "").toLowerCase(); }
  function mmss(s) { return s ? Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2) : ""; }
  function msg(title, text, btn) {
    app.innerHTML = '<div class="rempty" style="margin-block:auto"><b>' + esc(title) + '</b><span>' + esc(text) + '</span>' + (btn || "") + '</div>';
  }
  function shell() {
    app.innerHTML = '<header class="rhead"><div class="rhead__text"><h1 class="rhead__title">ניהול</h1><span class="rhead__sub" id="cnt"></span></div></header>' +
      '<div class="pad" style="padding-bottom:0">' + playerHtml() + '</div><div class="pad"><label class="rfield"><span>חיפוש שיר או מבצע</span><input id="q" type="search" placeholder=" " autocomplete="off"></label><button type="button" class="rbtn rbtn--outline" id="cp">העתקת הרשימה המוצגת</button></div>' +
      '<div class="rlist" id="out"></div>';
    app.querySelector("#q").addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(draw, 200); });
    app.querySelector("#cp").addEventListener("click", copyAll);
  }
  function found() {
    var words = fold(document.getElementById("q").value.trim()).split(/\s+/).filter(Boolean);
    return { words: words, hit: songs.filter(function (m) { return words.every(function (w) { return m.f.indexOf(w) >= 0; }); }) };
  }
  /* every song that matches the search (not only the rows drawn), one per line: name, performer, length, code, file */
  function copyAll() {
    var b = document.getElementById("cp"), txt = found().hit.map(function (m) { return [m.title || m.name, m.artist, mmss(m.duration_sec), m.audio_object ? "יש קובץ" : "ללא קובץ"].join(String.fromCharCode(9)); }).join(String.fromCharCode(10));
    function done(ok) { b.textContent = ok ? "הועתק" : "ההעתקה נחסמה, אפשר לסמן ולהעתיק ידנית"; setTimeout(function () { b.textContent = "העתקת הרשימה המוצגת"; }, 2000); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { done(true); }, function () { done(false); }); else done(false);
  }
  function draw() {
    var f = found(), words = f.words, hit = f.hit, out = document.getElementById("out");
    document.getElementById("cnt").textContent = (words.length ? hit.length + " מתוך " : "") + songs.length + " שירים";
    if (!hit.length) { out.innerHTML = '<div class="rempty"><b>לא נמצא כלום</b><span>נסו מילה אחרת</span></div>'; return; }
    out.innerHTML = hit.slice(0, MAXROWS).map(function (m) {
      var has = m.audio_object && window.BioAudio;
      if (has) BioAudio.info(m.audio_object, m.title || m.name, m.artist);
      return '<div class="rrow"><div class="rrow__main"><span class="rrow__title">' + esc(m.title || m.name) + '</span>' + (m.artist ? '<span class="rrow__sub">' + esc(m.artist) + '</span>' : '') + '</div>' +
        (m.duration_sec ? '<span class="rchip rchip--s">' + mmss(m.duration_sec) + '</span>' : '') +
        '<span class="rchip rchip--s' + (m.audio_object ? ' rchip--ok' : '') + '">' + (m.audio_object ? "יש קובץ" : "ללא קובץ") + '</span>' +
        (has ? BioAudio.button(m.audio_object, true) : '') + '</div>';
    }).join("") + (hit.length > MAXROWS ? '<div class="rhint" style="padding:var(--gutter)">מוצגים ' + MAXROWS + ' הראשונים. מצמצמים בחיפוש כדי לראות את השאר.</div>' : '');
  }
  function load(offset, all) {
    return FLOA_AUTH.api("/rest/v1/music?select=id,name,title,artist,duration_sec,collection,audio_object&order=name,id&limit=1000&offset=" + offset).then(function (rows) {
      all = all.concat(rows);
      return rows.length === 1000 ? load(offset + 1000, all) : all;
    });
  }
  /* ONE player, fixed above the search: play or pause, a bar to any place in the song, the place and the length in time, the song's name and performer.
     The song's buttons in the rows start it; audio.js tells this page (event "bioaudio") what plays and where it is. */
  var cur = { name: "", t: 0, d: 0, playing: false }, dragging = false;
  var ICO = { play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="width:var(--icon-l);height:var(--icon-l)"><path d="M7 4.5v15l13-7.5z"/></svg>', pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="width:var(--icon-l);height:var(--icon-l)"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>' };
  function playerHtml() {
    return '<div class="rrow" id="pl" style="flex-wrap:wrap;gap:var(--sp-1) var(--gap-button)"><button type="button" class="rbtn rbtn--icon" id="pp" aria-label="השמעה" disabled>' + ICO.play + '</button>' +
      '<div class="rrow__main"><span class="rrow__title" id="pt">לא נבחר שיר</span><span class="rrow__sub" id="pa"></span></div>' +
      '<span class="rchip rchip--s" id="pc" style="direction:ltr;font-variant-numeric:tabular-nums">0:00 / 0:00</span>' +
      '<div class="bio-bar" style="flex:0 0 100%;padding-top:var(--sp-1)"><input type="range" id="pb" min="0" max="1000" value="0" step="1" aria-label="מקום בשיר" disabled style="display:block;width:100%;margin:0;direction:ltr;accent-color:var(--primary)"></div></div>';
  }
  function paintPlayer() {
    var pp = document.getElementById("pp"), pb = document.getElementById("pb"); if (!pp) return;
    var m = byObj[cur.name], on = !!cur.name;
    document.getElementById("pt").textContent = on ? (m ? (m.title || m.name) : "שיר") : "לא נבחר שיר";
    document.getElementById("pa").textContent = on && m ? (m.artist || "") : "";
    pp.disabled = !on; pb.disabled = !on || !(cur.d > 0);
    pp.innerHTML = cur.playing ? ICO.pause : ICO.play; pp.setAttribute("aria-label", cur.playing ? "השהיה" : "השמעה");
    document.getElementById("pc").textContent = mmss(Math.floor(cur.t)) + " / " + mmss(Math.round(cur.d || 0));
    if (!dragging) { pb.value = cur.d > 0 ? Math.round(cur.t / cur.d * 1000) : 0; pb.style.setProperty("--p", pb.value / 10 + "%"); }
  }
  document.addEventListener("bioaudio", function (ev) { var d = ev.detail || {}; cur = { name: d.name || "", t: d.t || 0, d: d.d || 0, playing: !!d.playing }; paintPlayer(); });
  document.addEventListener("click", function (e) { if (e.target.closest && e.target.closest("#pp") && window.BioAudio) BioAudio.playPause(); });
  document.addEventListener("pointerdown", function (e) { if (e.target.id === "pb") dragging = true; });
  document.addEventListener("pointerup", function () { dragging = false; });
  document.addEventListener("input", function (e) {
    if (e.target.id !== "pb" || !window.BioAudio) return;
    e.target.style.setProperty("--p", e.target.value / 10 + "%"); BioAudio.seek(e.target.value / 1000);
    var t = cur.d * e.target.value / 1000; document.getElementById("pc").textContent = mmss(Math.floor(t)) + " / " + mmss(Math.round(cur.d || 0));
  });
  function start() {
    if (!window.FLOA_AUTH || !FLOA_AUTH.signedIn()) return msg("ניהול", "צריך להיכנס קודם דרך האפליקציה.", '<a class="rbtn" href="' + HOME + '">לאפליקציה</a>');
    FLOA_AUTH.api("/rest/v1/rpc/me", { method: "POST", json: {} }).then(function (me) {
      if (!me || !me.admin) return msg("ניהול", "הדף הזה למנהלים בלבד.");
      shell();
      document.getElementById("out").innerHTML = '<div class="rskel rskel--title"></div>';
      return load(0, []).then(function (rows) {
        songs = rows.map(function (m) { m.f = fold([m.name, m.title, m.artist, m.collection].join(" ")); return m; });
        byObj = {}; songs.forEach(function (m) { if (m.audio_object) byObj[m.audio_object] = m; });
        draw();
      });
    }).catch(function () { msg("ניהול", "לא הצלחנו לטעון. נסו שוב."); });
  }
  start();
})();
</script>
</body>
</html>
