# =============================================================================
# floa.co.il, published.
#
# The repo holds source. This builds it and publishes the result, so no built
# file has to live in git for the site to exist. Every URL is unchanged: a URL
# resolves against the PUBLISHED package, and build.mjs writes dist/ with the
# same layout the repo root used to have.
#
# If the build fails, nothing is published and the live site simply stays as it
# was. That is safer than the arrangement this replaces, where a forgotten
# `node build.mjs` before a commit meant the site quietly did not update.
# =============================================================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:          # so a deploy can be re-run without an empty commit

  # THE LIBRARY CHANGED, AND NOBODY PUSHED ANYTHING.
  #
  # The songs of /chords/ are written to disk at build time, out of Supabase,
  # so a song published this morning is not on the site until the site is built
  # again. Worse the other way: a song taken off the shelf keeps its page, with
  # its words in it, until the same moment.
  #
  # So the database says so itself. A trigger on the songs table posts here the
  # moment a song is published, unpublished, deleted or restored, and this run
  # is the same build as any other: it asks the library again and writes what it
  # finds. See "התראה מהדאטהבייס" in businesses/chords/schema.sql.
  #
  # It fires on publication and NOT on saving. A song saves itself every second
  # while it is being typed, and a build per keystroke is not a fresher site, it
  # is a queue.
  repository_dispatch:
    types: [library-changed]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read             # to ask which run was the last one that published

# One deploy at a time, and the newest push wins: a queued run for a commit that
# has already been superseded has nothing to say.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the step below diffs against an older commit

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The lead endpoint decides which inbox a lead lands in. It is the one
      # thing here that cannot be allowed to break quietly, so it is tested
      # before anything is published.
      - run: npm test

      - run: node build.mjs

      # THE TWO BROWSER TESTS BELOW ARE ABOUT CHORDS AND NOTHING ELSE, and they
      # cost about half a minute, so they run when something Chords is built
      # from has changed and not on a push that only touched another business.
      #
      # "Changed" is measured against the last run that PUBLISHED, not against
      # the previous commit. The two differ when a run is cancelled by a newer
      # push (see `concurrency` above): a Chords change in the cancelled push
      # would then sit in neither push's own diff and ship untested. Against
      # the last publication it is always in the diff, until something that
      # tested it has published.
      #
      # Anything this cannot work out (a manual run, no earlier publication,
      # a commit that is gone) runs them. Skipping is only ever the answer to
      # "I looked, and nothing Chords depends on moved".
      - name: did anything Chords is built from change?
        id: chords
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
            if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              if git diff --quiet "$base" HEAD -- businesses/chords src build.mjs package.json businesses/floa/domain .github/workflows/deploy.yml; then
                run=false
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "chords browser tests: $run (last publication: ${base:-none})"

      # A chord that does not sit on its syllable is the one way this can be
      # broken while every unit test still passes, and reading the code does
      # not settle it. So a real browser opens the built page and measures.
      - if: steps.chords.outputs.run == 'true'
        run: npm run test:layout

      # And the same browser presses back, because a page that was left has to
      # come back as the page it was and not as a fresh one at the top of
      # itself. Also unreadable from the code: it is all about the address.
      - if: steps.chords.outputs.run == 'true'
        run: npm run test:stack

      # The roster pages keep one design: square popups, the X at the top left,
      # no sideways scroll, an add button that floats. scripts/roster-policy.mjs
      # already read the source (it runs inside npm test); this opens the built
      # pages in a real browser and measures. Only when something roster is built
      # from changed since the last publication, like the Chords tests above.
      - name: did anything roster is built from change?
        id: roster
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
            if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              if git diff --quiet "$base" HEAD -- businesses/roster src build.mjs package.json businesses/floa/domain scripts/roster-ui.test.mjs scripts/roster-policy.mjs scripts/policy-allow.json .github/workflows/deploy.yml; then
                run=false
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "roster browser tests: $run (last publication: ${base:-none})"

      - if: steps.roster.outputs.run == 'true'
        run: npm run test:roster-ui

      # The generated Worker table must match what was committed. If it does
      # not, someone changed a business and pushed without rebuilding — and the
      # Worker deployed from this repo would be validating the wrong pages.
      - name: worker table is in step with the businesses
        run: git diff --exit-code -- worker/src/businesses.js

      # `enablement` is what moves Pages off "serve the main branch as-is" and
      # onto "serve what this workflow builds". It is the switch that lets the
      # built pages leave the repo. Harmless once flipped: it simply stays.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
