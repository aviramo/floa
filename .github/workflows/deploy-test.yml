# =============================================================================
# test.floa.co.il, published from the `test` branch.
#
# The same repo, the same build as the real site. Only two things differ: the
# pages are adjusted by scripts/inject-test.mjs (every database call goes to
# the `test` schema, an orange bar says so, noindex), and the result goes to
# its own Cloudflare Pages project, `floa-test`, whose address is
# test.floa.co.il. The real site is untouched by anything here.
#
# Needs two secrets on the repo: CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit)
# and CLOUDFLARE_ACCOUNT_ID. The project is created on the first run.
# =============================================================================
name: Deploy test

on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The same gate as the real deploy: if this fails, nothing is published.
      - run: npm test

      - run: node build.mjs

      - name: the worker table is in step with the businesses
        run: git diff --exit-code -- worker/src/businesses.js

      - run: node scripts/inject-test.mjs dist

      - name: publish to Cloudflare Pages (project floa-test)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # say what is missing, never what the values are
          [ -n "$CLOUDFLARE_API_TOKEN" ] && echo "token: set" || { echo "token: MISSING (secret CLOUDFLARE_API_TOKEN)"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo "account id: set, ${#CLOUDFLARE_ACCOUNT_ID} characters (should be 32)" || { echo "account id: MISSING (secret CLOUDFLARE_ACCOUNT_ID)"; exit 1; }
          npx --yes wrangler@4 whoami
          npx --yes wrangler@4 pages project create floa-test --production-branch main || echo "(project create did not succeed; it may already exist)"
          npx --yes wrangler@4 pages deploy dist --project-name floa-test --branch main --commit-dirty=true
